<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPL Official App Experience 2026/27</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --fpl-purple: #37003c;
            --fpl-green: #00ff87;
            --fpl-pink: #e90052;
            --bg-dark: #12001a;
            --card-bg: #22002a;
            --fdr-1: #00ff87;
            --fdr-2: #05f0ff;
            --fdr-3: #e1e1e1;
            --fdr-4: #ff1744;
            --fdr-5: #800020;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            margin: 0;
            padding-bottom: 70px; /* Space for Bottom Nav */
        }

        /* App Top Bar */
        header {
            background: var(--fpl-purple);
            border-bottom: 3px solid var(--fpl-green);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 18px;
            color: var(--fpl-green);
        }

        .hud-stats {
            display: flex;
            gap: 12px;
        }

        .stat-badge {
            background: rgba(255,255,255,0.1);
            padding: 4px 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 12px;
        }

        .stat-badge span {
            color: var(--fpl-green);
            font-weight: bold;
        }

        /* Screen Views */
        .screen { display: none; padding: 15px; }
        .screen.active { display: block; }

        /* AI Quick Action Bar */
        .ai-bar {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-ai {
            background: linear-gradient(45deg, #00ff87, #00b0ff);
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Official Pitch Layout */
        .pitch-container {
            background: #008040;
            background-image: linear-gradient(#008f48 2px, transparent 2px), linear-gradient(90deg, #008f48 2px, transparent 2px);
            background-size: 40px 40px;
            border: 3px solid #ffffff;
            border-radius: 12px;
            padding: 15px 5px;
            min-height: 480px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }

        .pitch-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 8px 0;
        }

        .slot-card {
            background: rgba(55, 0, 60, 0.85);
            border: 2px dashed rgba(255,255,255,0.4);
            border-radius: 8px;
            width: 72px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
        }

        .slot-card.filled {
            border: 2px solid var(--fpl-green);
            background: var(--fpl-purple);
        }

        .slot-card img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            background: #fff;
        }

        .slot-card .add-icon {
            font-size: 24px;
            color: var(--fpl-green);
            font-weight: bold;
        }

        .slot-card .p-name {
            font-size: 9px;
            font-weight: bold;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 68px;
            text-align: center;
        }

        .slot-card .p-price {
            font-size: 8px;
            color: var(--fpl-green);
        }

        .remove-btn {
            position: absolute;
            top: -4px;
            left: -4px;
            background: red;
            color: white;
            border: none;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 9px;
            cursor: pointer;
        }

        /* Players Transfer Market Screen */
        .search-box {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #4a0052;
            background: #190022;
            color: #fff;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .filter-btn {
            background: #280033;
            color: #ccc;
            border: 1px solid #4a0052;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .filter-btn.active {
            background: var(--fpl-green);
            color: #000;
            font-weight: bold;
        }

        .players-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .player-row-item {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #3d004c;
        }

        .p-info-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .p-info-left img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fff;
        }

        .p-details div { font-size: 13px; font-weight: bold; }
        .p-details small { color: #aaa; font-size: 11px; }

        .fdr-pill {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
            color: #000;
            margin-right: 5px;
        }

        .fdr-1 { background: var(--fdr-1); }
        .fdr-2 { background: var(--fdr-2); }
        .fdr-3 { background: var(--fdr-3); }
        .fdr-4 { background: var(--fdr-4); color: #fff; }
        .fdr-5 { background: var(--fdr-5); color: #fff; }

        .btn-add-p {
            background: var(--fpl-green);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-add-p.in-squad {
            background: var(--fpl-pink);
            color: #fff;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--fpl-purple);
            border-top: 2px solid var(--fpl-green);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #aaa;
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-item.active {
            color: var(--fpl-green);
            font-weight: bold;
        }

        .nav-item div { font-size: 18px; }
    </style>
</head>
<body>

        { id: 34, name: "نيكولاس جاكسون", club: "تشيلسي", pos: "FWD", price: 7.9, fdr: "NFO (H)", fdrL: 2, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p492429.png" },
        { id: 35, name: "كريس وود", club: "نوتنغهام فورست", pos: "FWD", price: 6.2, fdr: "CHE (A)", fdrL: 4, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p60689.png" },
        { id: 36, name: "دومينيك سولانكي", club: "توتنهام", pos: "FWD", price: 7.5, fdr: "BHA (A)", fdrL: 3, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p154566.png" },

    ];

    let squad = [];
    let budget = 100.0;
    let selectedPosFilter = 'ALL';
    let selectedClubFilter = 'ALL';
    let targetPosForAdd = null;

    // Formation slot structure: 2 GKP, 5 DEF, 5 MID, 3 FWD
    const formationSlots = [
        { pos: 'GKP', count: 2 },
        { pos: 'DEF', count: 5 },
        { pos: 'MID', count: 5 },
        { pos: 'FWD', count: 3 }
    ];

    // Screen Switching
    function switchScreen(screenName) {
        document.getElementById('squadScreen').classList.remove('active');
        document.getElementById('marketScreen').classList.remove('active');
        document.getElementById('navSquad').classList.remove('active');
        document.getElementById('navMarket').classList.remove('active');

        if(screenName === 'squad') {
            document.getElementById('squadScreen').classList.add('active');
            document.getElementById('navSquad').classList.add('active');
        } else {
            document.getElementById('marketScreen').classList.add('active');
            document.getElementById('navMarket').classList.add('active');
            filterPlayers();
        }
    }

    // Render Pitch Slots with (+)
    function renderPitch() {
        const pitch = document.getElementById('pitchContainer');
        pitch.innerHTML = '';

        formationSlots.forEach(group => {
            const row = document.createElement('div');
            row.className = 'pitch-row';

            const posPlayers = squad.filter(p => p.pos === group.pos);

            for(let i = 0; i < group.count; i++) {
                const player = posPlayers[i];
                const card = document.createElement('div');

                if(player) {
                    card.className = 'slot-card filled';
                    card.innerHTML = `
                        <button class="remove-btn" onclick="removePlayer(${player.id})">✕</button>
                        <img src="${player.img}" alt="${player.name}" onerror="this.src='https://resources.premierleague.com/premierleague/photos/players/250x250/Photo-Missing.png'">
                        <span class="p-name">${player.name}</span>
                        <span class="p-price">£${player.price}m</span>
                    `;
                } else {
                    card.className = 'slot-card';
                    card.innerHTML = `
                        <span class="add-icon">+</span>
                        <span style="font-size:9px; color:#aaa;">${group.pos}</span>
                    `;
                    card.onclick = () => {
                        setPosFilter(group.pos);
                        switchScreen('market');
                    };
                }
                row.appendChild(card);
            }
            pitch.appendChild(row);
        });
    }

    // Add / Remove Handlers
    function addPlayer(id) {
        const p = playersDatabase.find(x => x.id === id);
        if(!p) return;

        if(squad.some(x => x.id === id)) {
            removePlayer(id);
            return;
        }

        if(squad.length >= 15) { alert('⚠️ التشكيلة مكتملة بـ 15 لاعب!'); return; }
        if(budget < p.price) { alert('⚠️ الميزانية غير كافية!'); return; }

        // Position limit check
        const posCount = squad.filter(x => x.pos === p.pos).length;
        const maxForPos = formationSlots.find(x => x.pos === p.pos).count;
        if(posCount >= maxForPos) {
            alert(`⚠️ القائمة مكتملة بهذا المركز (${p.pos})! قم بإزالة لاعب أولاً.`);
            return;
        }

        // Club limit check (Max 3)
        const clubCount = squad.filter(x => x.club === p.club).length;
        if(clubCount >= 3) {
            alert(`⚠️ لا يمكن اختيار أكثر من 3 لاعبين من فريق واحد (${p.club})!`);
            return;
        }

        squad.push(p);
        budget -= p.price;
        updateStats();
        renderPitch();
        filterPlayers();
    }

    function removePlayer(id) {
        const idx = squad.findIndex(x => x.id === id);
        if(idx > -1) {
            budget += squad[idx].price;
            squad.splice(idx, 1);
            updateStats();
            renderPitch();
            filterPlayers();
        }
    }

    // AI Automatic Squad Builder (Strictly 15 players)
    function generateAISquad() {
        squad = [];
        budget = 100.0;

        let sorted = [...playersDatabase].sort((a,b) => a.fdrL - b.fdrL || b.price - a.price);

        formationSlots.forEach(group => {
            let count = 0;
            for(let p of sorted) {
                if(p.pos === group.pos && count < group.count) {
                    let clubCount = squad.filter(x => x.club === p.club).length;
                    if(budget >= p.price && clubCount < 3) {
                        squad.push(p);
                        budget -= p.price;
                        count++;
                    }
                }
            }
        });

        updateStats();
        renderPitch();
        alert('✨ تم اختيار التشكيلة بالذكاء الاصطناعي بنجاح ضمن الميزانية والقواعد الرسمية!');
    }

    function updateStats() {
        document.getElementById('budgetDisplay').innerText = '£' + budget.toFixed(1) + 'm';
        document.getElementById('countDisplay').innerText = squad.length + '/15';
    }

    // Market Filtering
    function setPosFilter(pos) {
        selectedPosFilter = pos;
        document.querySelectorAll('#positionFilters .filter-btn').forEach(b => {
            b.classList.toggle('active', b.innerText.includes(pos) || (pos==='ALL' && b.innerText==='الكل'));
        });
        filterPlayers();
    }

    function filterPlayers() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const container = document.getElementById('playersListContainer');
        container.innerHTML = '';

        const filtered = playersDatabase.filter(p => {
            const matchesSearch = p.name.toLowerCase().includes(query) || p.club.toLowerCase().includes(query);
            const matchesPos = selectedPosFilter === 'ALL' || p.pos === selectedPosFilter;
            const matchesClub = selectedClubFilter === 'ALL' || p.club === selectedClubFilter;
            return matchesSearch && matchesPos && matchesClub;
        });

        filtered.forEach(p => {
            const inSquad = squad.some(x => x.id === p.id);
            const item = document.createElement('div');
            item.className = 'player-row-item';
            item.innerHTML = `
                <div class="p-info-left">
                    <img src="${p.img}" alt="${p.name}" onerror="this.src='https://resources.premierleague.com/premierleague/photos/players/250x250/Photo-Missing.png'">
                    <div class="p-details">
                        <div>${p.name} <span class="fdr-pill fdr-${p.fdrL}">${p.fdr}</span></div>
                        <small>${p.club} | <b style="color:var(--fpl-green);">${p.pos}</b></small>
                    </div>
                </div>
                <div>
                    <span style="font-weight:bold; font-size:14px; margin-left:10px;">£${p.price}m</span>
                    <button class="btn-add-p ${inSquad ? 'in-squad' : ''}" onclick="addPlayer(${p.id})">
                        ${inSquad ? 'إزالة' : 'إضافة +'}
                    </button>
                </div>
            `;
            container.appendChild(item);
        });
    }

    // Generate Club Filter Buttons
    const clubs = ['ALL', ...new Set(playersDatabase.map(p => p.club))];
    const clubFiltersContainer = document.getElementById('clubFilters');
    clubs.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (c === 'ALL' ? ' active' : '');
        btn.innerText = c === 'ALL' ? 'كل الأندية' : c;
        btn.onclick = () => {
            selectedClubFilter = c;
            document.querySelectorAll('#clubFilters .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterPlayers();
        };
        clubFiltersContainer.appendChild(btn);
    });

    // Init App
    renderPitch();
    filterPlayers();
</script>

</body>
</html>
