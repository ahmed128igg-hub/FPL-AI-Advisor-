<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FPL Ultra Manager 2026/27</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --fpl-purple: #37003c;
            --fpl-green: #00ff87;
            --fpl-pink: #e90052;
            --fpl-cyan: #04f5ff;
            --bg-dark: #0f0114;
            --card-glass: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            padding-bottom: 75px;
            overflow-x: hidden;
        }

        /* Splash Screen with Official FPL Vibe */
        #splash-screen {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, #590062 0%, var(--fpl-purple) 100%);
            z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .splash-logo {
            width: 110px; height: 110px;
            background: #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(0, 255, 135, 0.4);
            animation: pulse 1.5s infinite ease-in-out;
        }

        .splash-logo img { width: 75px; height: 75px; object-fit: contain; }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 135, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(0, 255, 135, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 135, 0); }
        }

        header {
            background: rgba(55, 0, 60, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--fpl-green);
            padding: 12px 16px; position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }

        header h1 { font-size: 16px; color: var(--fpl-green); font-weight: 900; letter-spacing: 0.5px; }
        
        .hud-stats { display: flex; gap: 10px; }
        .stat-badge {
            background: var(--card-glass); border: 1px solid var(--card-border);
            padding: 4px 10px; border-radius: 8px; font-size: 11px; text-align: center;
        }
        .stat-badge span { color: var(--fpl-green); font-weight: bold; }

        .main-container { max-width: 800px; margin: 0 auto; padding: 12px; }
        .screen { display: none; }
        .screen.active { display: block; }

        /* Quick AI Generator Button */
        .btn-ai {
            width: 100%; margin-bottom: 12px;
            background: linear-gradient(135deg, var(--fpl-green), var(--fpl-cyan));
            color: #000; border: none; padding: 12px; font-weight: 800; font-size: 13px;
            border-radius: 10px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 135, 0.3);
            transition: transform 0.2s;
        }
        .btn-ai:active { transform: scale(0.98); }

        /* Modern 3D Stadium Field */
        .pitch {
            background: linear-gradient(180deg, #165b26 0%, #0d3817 100%);
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 16px; padding: 15px 5px; min-height: 480px;
            display: flex; flex-direction: column; justify-content: space-between;
            position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .pitch::before {
            content: ''; position: absolute; top: 50%; left: 0; right: 0;
            height: 2px; background: rgba(255,255,255,0.3);
        }

        .pitch-row { display: flex; justify-content: center; gap: 6px; z-index: 2; }

        .bench-box {
            background: rgba(20, 0, 25, 0.9);
            border: 1px solid var(--card-border);
            border-radius: 12px; padding: 10px; margin-top: 12px;
        }
        .bench-title { font-size: 11px; color: var(--fpl-cyan); text-align: center; font-weight: bold; margin-bottom: 8px; }

        /* Sleek Player Slots */
        .slot {
            background: rgba(30, 0, 40, 0.85);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
            width: 20%; max-width: 72px; min-width: 58px; height: 100px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 4px; cursor: pointer; position: relative; backdrop-filter: blur(4px);
            transition: all 0.2s ease;
        }
        .slot.filled { border-color: var(--fpl-green); background: rgba(55, 0, 60, 0.9); }
        .slot img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,0.1); }
        .slot .p-name { font-size: 8.5px; font-weight: 700; width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .slot .p-price { font-size: 8px; color: var(--fpl-green); font-weight: bold; }

        .c-badge {
            position: absolute; top: -4px; right: -4px;
            background: #ffcc00; color: #000; font-weight: 900; font-size: 9px;
            width: 18px; height: 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; border: 1.5px solid #000;
        }

        /* Market Cards */
        .search-box {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid var(--card-border); background: rgba(255,255,255,0.05);
            color: #fff; margin-bottom: 10px; font-size: 13px; outline: none;
        }
        .search-box:focus { border-color: var(--fpl-green); }

        .filter-bar { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
        .filter-btn {
            background: rgba(255,255,255,0.05); color: #ccc; border: 1px solid var(--card-border);
            padding: 6px 14px; border-radius: 20px; font-size: 11px; cursor: pointer; white-space: nowrap;
        }
        .filter-btn.active { background: var(--fpl-green); color: #000; font-weight: 800; }

        .player-card {
            background: var(--card-glass); border: 1px solid var(--card-border);
            border-radius: 10px; padding: 10px 14px; margin-bottom: 8px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .player-card img { width: 42px; height: 42px; border-radius: 50%; background: #fff; }

        .btn-add {
            background: var(--fpl-green); color: #000; border: none;
            padding: 6px 14px; border-radius: 6px; font-weight: 800; cursor: pointer;
        }
        .btn-add.added { background: var(--fpl-pink); color: #fff; }

        /* Navigation */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(55, 0, 60, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid var(--card-border);
            display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000;
        }
        .nav-btn { display: flex; flex-direction: column; align-items: center; color: #888; font-size: 10px; cursor: pointer; }
        .nav-btn.active { color: var(--fpl-green); font-weight: bold; }

        /* Modal Popup */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; }
        .modal-box { background: var(--fpl-purple); border: 1px solid var(--fpl-green); border-radius: 14px; padding: 20px; width: 85%; max-width: 300px; text-align: center; }
        .modal-btn { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<!-- Splash Screen -->
<div id="splash-screen">
    <div class="splash-logo">
        <img src="https://upload.wikimedia.org/wikipedia/en/f/f2/Premier_League_Logo.svg" alt="FPL Logo">
    </div>
    <h2 style="margin-top:20px; font-size:16px; color:var(--fpl-green); font-weight:800;">FPL Pro 2026/27</h2>
</div>

<header>
    <h1>⚽ FPL ULTRA</h1>
    <div class="hud-stats">
        <div class="stat-badge">الميزانية: <span id="budgetText">£100.0m</span></div>
        <div class="stat-badge">اللاعبين: <span id="countText">0/15</span></div>
    </div>
</header>

<div class="main-container">

    <!-- Squad Screen -->
    <div id="squadScreen" class="screen active">
        <button class="btn-ai" onclick="autoGenerateSquad()">⚡ إنشاء تشكيلة الذكاء الاصطناعي تلقائياً</button>
        
        <div class="pitch" id="pitchLayout"></div>

        <div class="bench-box">
            <div class="bench-title">مقاعد البدلاء (4 لاعبين)</div>
            <div class="pitch-row" id="benchLayout"></div>
        </div>
    </div>

    <!-- Market Screen -->
    <div id="marketScreen" class="screen">
        <input type="text" class="search-box" id="searchInput" placeholder="🔍 ابحث باسم اللاعب، النادي، أو المركز..." oninput="renderMarket()">
        <div class="filter-bar">
            <button class="filter-btn active" onclick="setFilter('ALL')">الكل</button>
            <button class="filter-btn" onclick="setFilter('GKP')">حراس</button>
            <button class="filter-btn" onclick="setFilter('DEF')">دفاع</button>
            <button class="filter-btn" onclick="setFilter('MID')">وسط</button>
            <button class="filter-btn" onclick="setFilter('FWD')">هجوم</button>
        </div>
        <div id="marketList"></div>
    </div>

</div>

<!-- Player Action Modal -->
<div class="modal" id="playerModal">
    <div class="modal-box">
        <h3 id="modalName" style="color:var(--fpl-green); margin-bottom:12px;"></h3>
        <button class="modal-btn" style="background:var(--fpl-green); color:#000;" onclick="makeCaptain('C')">تعيين كابتن (C)</button>
        <button class="modal-btn" style="background:#ddd; color:#000;" onclick="makeCaptain('VC')">تعيين نائب (VC)</button>
        <button class="modal-btn" style="background:var(--fpl-pink); color:#fff;" onclick="removePlayerFromSquad()">إزالة من الفريق</button>
        <button class="modal-btn" style="background:#444; color:#fff;" onclick="closeModal()">إغلاق</button>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-btn active" id="btnNavSquad" onclick="tab('squad')">
        <div style="font-size:18px;">🏟️</div>
        <span>الملعب</span>
    </div>
    <div class="nav-btn" id="btnNavMarket" onclick="tab('market')">
        <div style="font-size:18px;">🏃</div>
        <span>الانتقالات</span>
    </div>
</nav>

<script>
    let db = [];
    let squad = [];
    let budget = 100.0;
    let filterPos = 'ALL';
    let activePlayerId = null;
    let capId = null;
    let vcId = null;

    const pitchFormation = [
        { pos: 'GKP', count: 1 },
        { pos: 'DEF', count: 4 },
        { pos: 'MID', count: 4 },
        { pos: 'FWD', count: 2 }
    ];

    const logoFallback = "https://upload.wikimedia.org/wikipedia/en/f/f2/Premier_League_Logo.svg";

    window.addEventListener('DOMContentLoaded', () => {
        fetchFPLDataFast();
    });

    // Multi-Server Fast Auto Fetcher
    async function fetchFPLDataFast() {
        const target = 'https://fantasy.premierleague.com/api/bootstrap-static/';
        const servers = [
            `https://corsproxy.io/?${encodeURIComponent(target)}`,
            `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`,
            `https://proxy.cors.sh/${target}`
        ];

        for (let server of servers) {
            try {
                const res = await fetch(server);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.elements) {
                        parseData(data);
                        hideSplash();
                        return;
                    }
                }
            } catch (e) {
                console.warn('Trying next fast server...');
            }
        }
    }

    function parseData(data) {
        let teams = {};
        data.teams.forEach(t => teams[t.id] = t.name);
        const posNames = { 1: 'GKP', 2: 'DEF', 3: 'MID', 4: 'FWD' };

        db = data.elements.map(p => ({
            id: p.id,
            name: p.web_name,
            club: teams[p.team] || 'EPL',
            pos: posNames[p.element_type],
            price: p.now_cost / 10,
            pts: p.total_points,
            img: `https://resources.premierleague.com/premierleague/photos/players/250x250/p${p.code}.png`
        }));

        renderPitch();
        renderMarket();
    }

    function hideSplash() {
        const splash = document.getElementById('splash-screen');
        splash.style.opacity = '0';
        setTimeout(() => splash.style.display = 'none', 500);
    }

    function tab(name) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

        if(name === 'squad') {
            document.getElementById('squadScreen').classList.add('active');
            document.getElementById('btnNavSquad').classList.add('active');
        } else {
            document.getElementById('marketScreen').classList.add('active');
            document.getElementById('btnNavMarket').classList.add('active');
            renderMarket();
        }
    }

    function renderPitch() {
        const pitch = document.getElementById('pitchLayout');
        const bench = document.getElementById('benchLayout');
        pitch.innerHTML = ''; bench.innerHTML = '';

        let mainStarters = squad.slice(0, 11);
        pitchFormation.forEach(group => {
            const row = document.createElement('div');
            row.className = 'pitch-row';
            const posStarters = mainStarters.filter(p => p.pos === group.pos);

            for(let i = 0; i < group.count; i++) {
                row.appendChild(createSlotCard(posStarters[i], group.pos));
            }
            pitch.appendChild(row);
        });

        let benchPlayers = squad.slice(11, 15);
        const benchPos = ['GKP', 'DEF', 'MID', 'FWD'];
        for(let i = 0; i < 4; i++) {
            bench.appendChild(createSlotCard(benchPlayers[i], benchPos[i]));
        }
    }

    function createSlotCard(p, pos) {
        const card = document.createElement('div');
        if(p) {
            const isC = p.id === capId;
            const isVc = p.id === vcId;
            card.className = 'slot filled';
            card.innerHTML = `
                ${isC ? '<div class="c-badge">C</div>' : ''}
                ${isVc ? '<div class="c-badge" style="background:#ccc">V</div>' : ''}
                <img src="${p.img}" onerror="this.src='${logoFallback}'">
                <span class="p-name">${p.name}</span>
                <span class="p-price">£${p.price.toFixed(1)}m</span>
            `;
            card.onclick = () => openModal(p.id);
        } else {
            card.className = 'slot';
            card.innerHTML = `<span style="font-size:20px; color:var(--fpl-green)">+</span><span style="font-size:9px; color:#aaa">${pos}</span>`;
            card.onclick = () => { setFilter(pos); tab('market'); };
        }
        return card;
    }

    function autoGenerateSquad() {
        if(!db.length) return;
        squad = []; budget = 100.0; capId = null; vcId = null;
        const limits = { 'GKP': 2, 'DEF': 5, 'MID': 5, 'FWD': 3 };
        const counts = { 'GKP': 0, 'DEF': 0, 'MID': 0, 'FWD': 0 };

        let sorted = [...db].sort((a,b) => b.pts - a.pts);
        for(let p of sorted) {
            if(squad.length >= 15) break;
            let clubCnt = squad.filter(x => x.club === p.club).length;
            if(counts[p.pos] < limits[p.pos] && clubCnt < 3 && budget >= p.price) {
                if((15 - squad.length - 1) === 0 || (budget - p.price) >= ((14 - squad.length) * 4.0)) {
                    squad.push(p);
                    counts[p.pos]++;
                    budget -= p.price;
                }
            }
        }
        if(squad.length > 0) capId = squad[0].id;
        if(squad.length > 1) vcId = squad[1].id;
        updateHud(); renderPitch();
    }

    function togglePlayer(id) {
        const p = db.find(x => x.id === id);
        if(!p) return;
        const idx = squad.findIndex(x => x.id === id);

        if(idx > -1) {
            budget += squad[idx].price;
            if(capId === id) capId = null;
            if(vcId === id) vcId = null;
            squad.splice(idx, 1);
        } else {
            if(squad.length >= 15) return alert('التشكيلة مكتملة (15/15)!');
            if(budget < p.price) return alert('الميزانية لا تكفي!');
            if(squad.filter(x => x.club === p.club).length >= 3) return alert('الحد الأقصى 3 لاعبين من نفس الفريق!');
            squad.push(p);
            budget -= p.price;
        }
        updateHud(); renderPitch(); renderMarket();
    }

    function updateHud() {
        document.getElementById('budgetText').innerText = '£' + budget.toFixed(1) + 'm';
        document.getElementById('countText').innerText = squad.length + '/15';
    }

    function setFilter(pos) {
        filterPos = pos;
        document.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.toggle('active', b.innerText.includes(pos) || (pos === 'ALL' && b.innerText === 'الكل'));
        });
        renderMarket();
    }

    function renderMarket() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const container = document.getElementById('marketList');
        container.innerHTML = '';

        const list = db.filter(p => {
            const mQ = p.name.toLowerCase().includes(query) || p.club.toLowerCase().includes(query);
            const mP = filterPos === 'ALL' || p.pos === filterPos;
            return mQ && mP;
        });

        list.slice(0, 50).forEach(p => {
            const inS = squad.some(x => x.id === p.id);
            const card = document.createElement('div');
            card.className = 'player-card';
            card.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px;">
                    <img src="${p.img}" onerror="this.src='${logoFallback}'">
                    <div>
                        <div style="font-weight:bold; font-size:13px;">${p.name}</div>
                        <small style="color:#aaa;">${p.club} | <b style="color:var(--fpl-green);">${p.pos}</b></small>
                    </div>
                </div>
                <div>
                    <span style="font-weight:bold; font-size:12px; margin-left:8px;">£${p.price.toFixed(1)}m</span>
                    <button class="btn-add ${inS ? 'added' : ''}" onclick="togglePlayer(${p.id})">${inS ? 'إزالة' : '+'}</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function openModal(id) {
        activePlayerId = id;
        const p = squad.find(x => x.id === id);
        if(!p) return;
        document.getElementById('modalName').innerText = p.name;
        document.getElementById('playerModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('playerModal').style.display = 'none'; }

    function makeCaptain(type) {
        if(type === 'C') { capId = activePlayerId; if(vcId === activePlayerId) vcId = null; }
        else { vcId = activePlayerId; if(capId === activePlayerId) capId = null; }
        closeModal(); renderPitch();
    }

    function removePlayerFromSquad() {
        togglePlayer(activePlayerId); closeModal();
    }
</script>
</body>
</html>
