    <style>
        :root {
            --fpl-purple: #37003c;
            --fpl-green: #00ff87;
            --fpl-pink: #e90052;
            --bg-dark: #11001c;
            --card-bg: #24002d;
            --fdr-1: #00ff87;
            --fdr-2: #05f0ff;
            --fdr-3: #e1e1e1;
            --fdr-4: #ff1744;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: var(--fpl-purple);
            border-bottom: 4px solid var(--fpl-green);
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .title-area h1 {
            margin: 0;
            font-size: 24px;
            color: var(--fpl-green);
        }

        .hud-stats {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .stat-badge {
            background: rgba(255,255,255,0.08);
            padding: 8px 16px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-badge label {
            display: block;
            font-size: 11px;
            color: #aaa;
        }

        .stat-badge val {
            font-size: 18px;
            font-weight: bold;
            color: var(--fpl-green);
        }

        .btn-ai {
            background: linear-gradient(45deg, #00ff87, #00b0ff);
            color: #000;
            border: none;
            padding: 12px 22px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,255,135,0.4);
            transition: 0.2s;
        }

        .btn-ai:hover { transform: scale(1.04); }

        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
        }

        .clubs-panel {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 12px;
            height: 550px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .club-item-btn {
            width: 100%;
            background: #190022;
            color: white;
            border: 1px solid #4a0052;
            padding: 10px 12px;
            margin-bottom: 6px;
            border-radius: 6px;
            text-align: right;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .club-item-btn:hover, .club-item-btn.active {
            background: var(--fpl-purple);
            border-color: var(--fpl-green);
            color: var(--fpl-green);
        }

        .table-panel {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            height: 550px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th {
            background: var(--fpl-purple);
            color: #ccc;
            padding: 12px 10px;
            position: sticky;
            top: 0;
            font-size: 13px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #3c0047;
            font-size: 14px;
        }

        .fdr-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
            color: #000;
        }

        .fdr-1 { background: var(--fdr-1); }
        .fdr-2 { background: var(--fdr-2); }
        .fdr-3 { background: var(--fdr-3); }
        .fdr-4 { background: var(--fdr-4); color: #fff; }

        .btn-select {
            background: var(--fpl-green);
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-select.selected {
            background: var(--fpl-pink);
            color: #fff;
        }

        /* Pitch UI */
        .pitch-container {
            margin-top: 25px;
            background: #008040;
            background-image: radial-gradient(#00994d 15%, transparent 16%), radial-gradient(#00994d 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            border: 4px solid #ffffff;
            border-radius: 15px;
            padding: 20px;
        }

        .pitch-section-title {
            text-align: center;
            color: var(--fpl-green);
            font-size: 14px;
            margin: 10px 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .pitch-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .player-card {
            background: var(--fpl-purple);
            border: 2px solid var(--fpl-green);
            border-radius: 8px;
            width: 105px;
            padding: 8px 5px;
            text-align: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
            position: relative;
        }

        .player-card img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #fff;
            object-fit: cover;
        }

        .player-card .p-name {
            display: block;
            font-size: 11px;
            font-weight: bold;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-card .p-team {
            font-size: 9px;
            color: #aaa;
        }

        .player-card .p-price {
            font-size: 10px;
            color: var(--fpl-green);
            font-weight: bold;
        }

        .remove-btn {
            position: absolute;
            top: -5px;
            left: -5px;
            background: red;
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            cursor: pointer;
        }
    </style>
</head>

        "إيبسويتش تاون": [
            { id: 1701, name: "أريجانيت موريتش", pos: "GKP", price: 4.5, fdr: "WHU (A)", fdrLevel: 3, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p243609.png" },
            { id: 1702, name: "ليام ديلااب", pos: "FWD", price: 5.5, fdr: "WHU (A)", fdrLevel: 3, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p463748.png" },
            { id: 1703, name: "سام مرسي", pos: "MID", price: 5.0, fdr: "WHU (A)", fdrLevel: 3, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p114240.png" }
        ],
        "ولفرهامبتون": [
            { id: 1801, name: "سام جونستون", pos: "GKP", price: 4.5, fdr: "BRE (A)", fdrLevel: 3, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p101188.png" },
            { id: 1802, name: "ماتيوس كونا", pos: "FWD", price: 6.5, fdr: "BRE (A)", fdrLevel: 3, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p432490.png" },
            { id: 1803, name: "رايان أيت نوري", pos: "DEF", price: 4.5, fdr: "BRE (A)", fdrLevel: 3, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p461358.png" }
        ],
        "كريستال بالاس": [
            { id: 1901, name: "دين هندرسون", pos: "GKP", price: 4.5, fdr: "LIV (H)", fdrLevel: 4, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p172649.png" },
            { id: 1902, name: "إيزي إبيريتشي", pos: "MID", price: 6.8, fdr: "LIV (H)", fdrLevel: 4, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p232770.png" },
            { id: 1903, name: "جان فيليب ماتيتا", pos: "FWD", price: 7.5, fdr: "LIV (H)", fdrLevel: 4, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p220627.png" }
        ],
        "ساوثهامبتون": [
            { id: 2001, name: "أرون رامسديل", pos: "GKP", price: 4.5, fdr: "ARS (A)", fdrLevel: 5, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p225321.png" },
            { id: 2002, name: "تايلر ديبيلينج", pos: "MID", price: 4.5, fdr: "ARS (A)", fdrLevel: 5, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p541602.png" },
            { id: 2003, name: "كاميرون أرشر", pos: "FWD", price: 5.0, fdr: "ARS (A)", fdrLevel: 5, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p463748.png" }
        ]
    };

    let squad = [];
    let budget = 100.0;

    // Render Clubs Sidebar
    const clubsList = document.getElementById('clubsList');
    Object.keys(clubsData).forEach((club, index) => {
        const btn = document.createElement('button');
        btn.className = 'club-item-btn' + (index === 0 ? ' active' : '');
        btn.innerHTML = `<span>${club}</span> <small style="color:#888;">${clubsData[club].length} لعيبة</small>`;
        btn.onclick = () => {
            document.querySelectorAll('.club-item-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderPlayers(club);
        };
        clubsList.appendChild(btn);
    });

    // Render Players
    function renderPlayers(clubName) {
        document.getElementById('currentClubHeading').innerText = clubName;
        const tbody = document.getElementById('playersTbody');
        tbody.innerHTML = '';

        clubsData[clubName].forEach(p => {
            const inSquad = squad.some(item => item.id === p.id);
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${p.name}</strong></td>
                <td><span style="color:var(--fpl-green);">${p.pos}</span></td>
                <td><strong>£${p.price}m</strong></td>
                <td><span class="fdr-badge fdr-${p.fdrLevel}">${p.fdr}</span></td>
                <td>
                    <button class="btn-select ${inSquad ? 'selected' : ''}" onclick="togglePlayer(${p.id}, '${clubName}')">
                        ${inSquad ? 'إزالة' : 'اختيار'}
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Toggle Selection with FPL Rules (Max 3 per club)
    function togglePlayer(id, clubName) {
        let playerObj, playerClub;
        for(let c in clubsData) {
            let found = clubsData[c].find(x => x.id === id);
            if(found) { playerObj = found; playerClub = c; break; }
        }

        const idx = squad.findIndex(s => s.id === id);
        if(idx > -1) {
            budget += squad[idx].price;
            squad.splice(idx, 1);
        } else {
            // FPL Constraints Rules
            if(squad.length >= 15) { alert("⚠️ التشكيلة مكتملة بـ 15 لاعب!"); return; }
            if(budget < playerObj.price) { alert("⚠️ الميزانية غير كافية لشراء هذا اللاعب!"); return; }

            // Check max 3 players per club
            const clubCount = squad.filter(s => s.club === playerClub).length;
            if(clubCount >= 3) {
                alert(`⚠️ لا يمكن اختيار أكثر من 3 لاعبين من فريق واحد (${playerClub})!`);
                return;
            }

            budget -= playerObj.price;
            squad.push({...playerObj, club: playerClub});
        }

        updateStats();
        renderPlayers(clubName);
        renderPitch();
    }

    // Smart AI Generator complying with 3-player limit rule
    function generateAISquad() {
        squad = [];
        budget = 100.0;
        
        let allPlayers = [];
        for(let club in clubsData) {
            clubsData[club].forEach(p => {
                allPlayers.push({...p, club: club});
            });
        }

        // Sort by value/fdr
        allPlayers.sort((a,b) => a.fdrLevel - b.fdrLevel || a.price - b.price);

        // Required formation: 2 GKP, 5 DEF, 5 MID, 3 FWD
        const limits = { GKP: 2, DEF: 5, MID: 5, FWD: 3 };
        const currentCounts = { GKP: 0, DEF: 0, MID: 0, FWD: 0 };
        const clubCounts = {};

        for(let p of allPlayers) {
            let clubCount = clubCounts[p.club] || 0;
            if(squad.length < 15 && 
               budget >= p.price && 
               currentCounts[p.pos] < limits[p.pos] && 
               clubCount < 3) {
               
                squad.push(p);
                budget -= p.price;
                currentCounts[p.pos]++;
                clubCounts[p.club] = clubCount + 1;
            }
        }

        updateStats();
        renderPitch();
        const activeClubBtn = document.querySelector('.club-item-btn.active');
        if(activeClubBtn) {
            renderPlayers(activeClubBtn.querySelector('span').innerText);
        }
    }

    function updateStats() {
        document.getElementById('budgetDisplay').innerText = "£" + budget.toFixed(1) + "m";
        document.getElementById('countDisplay').innerText = squad.length + "/15";
    }

    function renderPitch() {
        const pitch = document.getElementById('pitchView');
        pitch.innerHTML = '';
        if(squad.length === 0) {
            pitch.innerHTML = '<div style="text-align:center; color:#ccc; padding:20px;">التشكيلة فارغة حالياً. حدد لاعبيك أو استخدم زر الذكاء الاصطناعي.</div>';
            return;
        }

        const positions = ['GKP', 'DEF', 'MID', 'FWD'];
        const posTitles = { GKP: 'حراسة المرمى', DEF: 'الدفاع', MID: 'الوسط', FWD: 'الهجوم' };

        positions.forEach(pos => {
            const posPlayers = squad.filter(p => p.pos === pos);
            if(posPlayers.length > 0) {
                const title = document.createElement('div');
                title.className = 'pitch-section-title';
                title.innerText = posTitles[pos];
                pitch.appendChild(title);

                const row = document.createElement('div');
                row.className = 'pitch-row';

                posPlayers.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'player-card';
                    card.innerHTML = `
                        <button class="remove-btn" onclick="togglePlayer(${p.id}, '${p.club}')">✕</button>
                        <img src="${p.img}" alt="${p.name}" onerror="this.src='https://resources.premierleague.com/premierleague/photos/players/250x250/Photo-Missing.png'">
                        <span class="p-name">${p.name}</span>
                        <span class="p-team">${p.club}</span>
                        <span class="p-price">£${p.price}m</span>
                    `;
                    row.appendChild(card);
                });

                pitch.appendChild(row);
            }
        });
    }

    // Init
    renderPlayers(Object.keys(clubsData)[0]);
</script>
