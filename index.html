<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fantasy Premier League Pro Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --fpl-purple: #37003c;
            --fpl-green: #00ff87;
            --fpl-pink: #ff005a;
            --fpl-dark: #240029;
            --bg-card: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', 'Poppins', sans-serif; user-select: none; }

        body { background-color: var(--fpl-dark); color: #fff; padding-bottom: 75px; min-height: 100vh; }

        /* Screen Gateway: Official FPL Style */
        #auth-gate {
            position: fixed; inset: 0; background: linear-gradient(135deg, var(--fpl-purple), #110013);
            z-index: 50000; display: flex; align-items: center; justify-content: center; padding: 20px;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            border: 1px solid var(--fpl-green); box-shadow: 0 10px 40px rgba(0, 255, 135, 0.2);
            border-radius: 20px; padding: 35px 25px; width: 100%; max-width: 400px; text-align: center;
        }

        .auth-logo { font-size: 32px; font-weight: 900; color: var(--fpl-green); margin-bottom: 5px; font-family: 'Poppins'; }
        .auth-subtitle { color: #ccc; font-size: 13px; margin-bottom: 25px; }

        .auth-input {
            width: 100%; padding: 14px; margin-bottom: 14px; border-radius: 10px;
            border: 1px solid var(--border); background: rgba(0, 0, 0, 0.3);
            color: #fff; font-size: 14px; outline: none; transition: 0.3s;
        }
        .auth-input:focus { border-color: var(--fpl-green); background: rgba(0, 0, 0, 0.5); }

        .auth-btn {
            width: 100%; padding: 14px; border-radius: 10px; border: none;
            background: var(--fpl-green); color: var(--fpl-purple); font-weight: 900;
            font-size: 16px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(0, 255, 135, 0.3);
        }
        .auth-btn:active { transform: scale(0.98); }

        /* Header Layout */
        header {
            background: var(--fpl-purple); border-bottom: 3px solid var(--fpl-green);
            padding: 12px 16px; position: sticky; top: 0; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
        }

        .brand { font-size: 18px; font-weight: 900; color: var(--fpl-green); letter-spacing: 0.5px; }

        .hud-wrapper { display: flex; gap: 8px; }
        .hud-item {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            padding: 5px 10px; border-radius: 8px; font-size: 12px;
        }
        .hud-item span { color: var(--fpl-green); font-weight: bold; }

        .container { max-width: 750px; margin: 0 auto; padding: 12px; }
        .page { display: none; }
        .page.active { display: block; }

        /* AI Action Button */
        .btn-ai {
            width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, var(--fpl-pink), #8000ff); color: #fff;
            font-size: 15px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 20px rgba(255, 0, 90, 0.4);
        }

        /* HD Football Pitch Design */
        .pitch-wrapper {
            background: linear-gradient(180deg, #115725 0%, #0a3817 100%);
            border: 3px solid rgba(255, 255, 255, 0.4); border-radius: 20px;
            padding: 20px 8px; min-height: 520px; display: flex; flex-direction: column;
            justify-content: space-between; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* Grass Stripes Pattern */
        .pitch-wrapper::before {
            content: ''; position: absolute; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(0,0,0,0.08) 40px, rgba(0,0,0,0.08) 80px);
            pointer-events: none;
        }

        .pitch-line-center {
            position: absolute; top: 50%; left: 0; right: 0; height: 2px;
            background: rgba(255,255,255,0.3); pointer-events: none;
        }
        .pitch-circle {
            position: absolute; top: 50%; left: 50%; width: 100px; height: 100px;
            border: 2px solid rgba(255,255,255,0.3); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }

        .pitch-row { display: flex; justify-content: center; gap: 8px; z-index: 5; margin: 5px 0; }

        /* Player Cards on Pitch */
        .player-card {
            background: rgba(15, 0, 20, 0.85); border: 1px solid var(--border);
            border-radius: 10px; width: 20%; max-width: 75px; min-width: 60px; height: 105px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 6px 3px; cursor: pointer; position: relative; backdrop-filter: blur(4px);
        }
        .player-card.active-player { border-color: var(--fpl-green); background: rgba(36, 0, 41, 0.95); }
        .player-card img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,0.1); }
        .player-card .p-name { font-size: 10px; font-weight: bold; width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-card .p-price { font-size: 9px; color: var(--fpl-green); font-weight: bold; }

        .captain-badge {
            position: absolute; top: -5px; right: -5px; background: #ffcc00; color: #000;
            font-weight: 900; font-size: 10px; width: 20px; height: 20px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; border: 1.5px solid #000;
        }

        .bench-box {
            background: rgba(20, 0, 25, 0.95); border: 1px solid var(--border);
            border-radius: 14px; padding: 12px; margin-top: 15px;
        }
        .bench-title { font-size: 12px; color: var(--fpl-green); text-align: center; font-weight: bold; margin-bottom: 10px; }

        /* Market & Database */
        .search-input {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.4); color: #fff; font-size: 14px; outline: none; margin-bottom: 12px;
        }
        .search-input:focus { border-color: var(--fpl-green); }

        .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 15px; }
        .filter-btn {
            background: var(--bg-card); color: #bbb; border: 1px solid var(--border);
            padding: 8px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap;
        }
        .filter-btn.active { background: var(--fpl-green); color: var(--fpl-purple); font-weight: 900; }

        .market-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            padding: 12px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between;
        }
        .market-card img { width: 45px; height: 45px; border-radius: 50%; background: #fff; }
        .market-info { flex: 1; margin: 0 12px; }
        .market-info h4 { font-size: 14px; color: #fff; }
        .market-info p { font-size: 11px; color: #aaa; }

        .action-btn {
            background: var(--fpl-green); color: var(--fpl-purple); border: none; padding: 8px 16px;
            border-radius: 8px; font-weight: 900; cursor: pointer;
        }
        .action-btn.remove { background: var(--fpl-pink); color: #fff; }

        /* Status & Loading Loader */
        #loading-status {
            display: none; text-align: center; padding: 10px; font-size: 12px; color: var(--fpl-green);
        }

        /* Bottom Nav */
        .navbar {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--fpl-purple);
            border-top: 1px solid var(--border); display: flex; justify-content: space-around;
            padding: 10px 0; z-index: 2000;
        }
        .nav-link { display: flex; flex-direction: column; align-items: center; color: #888; font-size: 11px; cursor: pointer; }
        .nav-link.active { color: var(--fpl-green); font-weight: bold; }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; }
        .modal-body { background: var(--fpl-purple); border: 2px solid var(--fpl-green); border-radius: 16px; padding: 20px; width: 85%; max-width: 320px; text-align: center; }
        .m-btn { width: 100%; padding: 12px; margin: 6px 0; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<!-- Login Gate -->
<div id="auth-gate">
    <div class="auth-card">
        <div class="auth-logo">Fantasy</div>
        <div class="auth-subtitle">سجل الدخول بحسابك للربط التلقائي بالدوري الممتاز</div>
        <input type="email" id="emailInput" class="auth-input" placeholder="البريد الإلكتروني (Email)">
        <input type="password" id="passInput" class="auth-input" placeholder="كلمة المرور (Password)">
        <button class="auth-btn" onclick="loginUser()">تسجيل الدخول ⚡</button>
    </div>
</div>

<header>
    <div class="brand">⚽ FPL MANAGER</div>
    <div class="hud-wrapper">
        <div class="hud-item">الميزانية: <span id="budgetText">£100.0m</span></div>
        <div class="hud-item">الفرق: <span id="countText">0/15</span></div>
    </div>
</header>

<div class="container">
    <div id="loading-status">⚡ جاري مزامنة قاعدة البيانات الرسمية بالكامل...</div>

    <!-- Pitch Page -->
    <div id="squadPage" class="page active">
        <button class="btn-ai" onclick="generateAISquad()">🤖 بناء أفضل تشكيلة بالذكاء الاصطناعي</button>
        <div class="pitch-wrapper" id="pitchLayout">
            <div class="pitch-line-center"></div>
            <div class="pitch-circle"></div>
        </div>
        <div class="bench-box">
            <div class="bench-title">دكة البدلاء (4 لاعبين)</div>
            <div class="pitch-row" id="benchLayout"></div>
        </div>
    </div>

    <!-- Market Page -->
    <div id="marketPage" class="page">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 بحث عن لاعب أو فريق..." oninput="renderMarket()">
        <div class="filter-bar">
            <button class="filter-btn active" onclick="setPosFilter('ALL')">الكل (600+)</button>
            <button class="filter-btn" onclick="setPosFilter('GKP')">حراس (GKP)</button>
            <button class="filter-btn" onclick="setPosFilter('DEF')">دفاع (DEF)</button>
            <button class="filter-btn" onclick="setPosFilter('MID')">وسط (MID)</button>
            <button class="filter-btn" onclick="setPosFilter('FWD')">هجوم (FWD)</button>
        </div>
        <div id="marketList"></div>
    </div>

    <!-- User Profile -->
    <div id="userPage" class="page">
        <div class="bench-box" style="text-align: center;">
            <h3 style="color:var(--fpl-green); margin-bottom: 10px;">👤 بيانات الحساب المسجل</h3>
            <p id="userDisplay" style="margin-bottom: 15px; font-size: 14px; color: #ccc;"></p>
            <button class="m-btn" style="background:var(--fpl-pink); color:#fff;" onclick="logout()">تسجيل الخروج</button>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal" id="playerModal">
    <div class="modal-body">
        <h3 id="modalPlayerName" style="color:var(--fpl-green); margin-bottom:15px;"></h3>
        <button class="m-btn" style="background:var(--fpl-green); color:var(--fpl-purple);" onclick="setCaptain('C')">تعيين كابتن (C)</button>
        <button class="m-btn" style="background:#ddd; color:#000;" onclick="setCaptain('VC')">نائب كابتن (VC)</button>
        <button class="m-btn" style="background:var(--fpl-pink); color:#fff;" onclick="removeFromSquad()">إزالة من التشكيلة</button>
        <button class="m-btn" style="background:#333; color:#fff;" onclick="closeModal()">إغلاق</button>
    </div>
</div>

<!-- Nav -->
<nav class="navbar">
    <div class="nav-link active" id="btnSquad" onclick="switchPage('squad')">
        <div style="font-size:18px;">🏟️</div>
        <span>التشكيلة</span>
    </div>
    <div class="nav-link" id="btnMarket" onclick="switchPage('market')">
        <div style="font-size:18px;">🔍</div>
        <span>الانتقالات</span>
    </div>
    <div class="nav-link" id="btnUser" onclick="switchPage('user')">
        <div style="font-size:18px;">👤</div>
        <span>حسابي</span>
    </div>
</nav>

<script>
    let playersDB = [];
    let activeSquad = [];
    let remainingBudget = 100.0;
    let currentFilter = 'ALL';
    let selectedPlayerId = null;
    let captainId = null;
    let viceCaptainId = null;

    const pitchFormation = [
        { pos: 'GKP', count: 1 },
        { pos: 'DEF', count: 4 },
        { pos: 'MID', count: 4 },
        { pos: 'FWD', count: 2 }
    ];

    const fallbackImg = "https://upload.wikimedia.org/wikipedia/en/f/f2/Premier_League_Logo.svg";

    window.addEventListener('DOMContentLoaded', () => {
        const user = localStorage.getItem('fpl_session_user');
        if (user) {
            document.getElementById('auth-gate').style.display = 'none';
            document.getElementById('userDisplay').innerText = `الحساب: ${user}`;
            fetchOfficialData();
        }
    });

    function loginUser() {
        const email = document.getElementById('emailInput').value.trim();
        const pass = document.getElementById('passInput').value.trim();
        if (!email || !pass) return alert('يرجى كتابة البريد الإلكتروني وكلمة المرور!');

        localStorage.setItem('fpl_session_user', email);
        document.getElementById('userDisplay').innerText = `الحساب: ${email}`;
        document.getElementById('auth-gate').style.display = 'none';
        fetchOfficialData();
    }

    function logout() {
        localStorage.removeItem('fpl_session_user');
        location.reload();
    }

    // High Reliability Data Fetcher
    async function fetchOfficialData() {
        const loader = document.getElementById('loading-status');
        loader.style.display = 'block';

        const targetUrl = 'https://fantasy.premierleague.com/api/bootstrap-static/';
        const proxies = [
            `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
            `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`
        ];

        let loaded = false;
        for (let url of proxies) {
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.elements) {
                        processData(data);
                        loaded = true;
                        break;
                    }
                }
            } catch (e) { console.warn('Retrying with secondary proxy...'); }
        }

        if (!loaded) {
            alert('تعذر تحميل البيانات المباشرة، يرجى إعادة تحديث الصفحة.');
        }
        loader.style.display = 'none';
    }

    function processData(data) {
        let teams = {};
        data.teams.forEach(t => teams[t.id] = t.name);
        const positions = { 1: 'GKP', 2: 'DEF', 3: 'MID', 4: 'FWD' };

        playersDB = data.elements.map(item => ({
            id: item.id,
            name: item.web_name,
            fullName: `${item.first_name} ${item.second_name}`,
            club: teams[item.team] || 'Club',
            pos: positions[item.element_type],
            price: item.now_cost / 10,
            pts: item.total_points,
            score: (item.total_points * 0.7) + ((item.now_cost / 10) * 0.3),
            img: `https://resources.premierleague.com/premierleague/photos/players/250x250/p${item.code}.png`
        }));

        renderPitch();
        renderMarket();
    }

    function switchPage(page) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));

        document.getElementById(page + 'Page').classList.add('active');
        document.getElementById('btn' + page.charAt(0).toUpperCase() + page.slice(1)).classList.add('active');
    }

    function renderPitch() {
        const pitch = document.getElementById('pitchLayout');
        const bench = document.getElementById('benchLayout');
        pitch.innerHTML = '<div class="pitch-line-center"></div><div class="pitch-circle"></div>';
        bench.innerHTML = '';

        let mainSquad = activeSquad.slice(0, 11);
        pitchFormation.forEach(group => {
            const row = document.createElement('div');
            row.className = 'pitch-row';
            const posPlayers = mainSquad.filter(x => x.pos === group.pos);

            for (let i = 0; i < group.count; i++) {
                row.appendChild(createCard(posPlayers[i], group.pos));
            }
            pitch.appendChild(row);
        });

        let benchSquad = activeSquad.slice(11, 15);
        const benchTypes = ['GKP', 'DEF', 'MID', 'FWD'];
        for (let i = 0; i < 4; i++) {
            bench.appendChild(createCard(benchSquad[i], benchTypes[i]));
        }
    }

    function createCard(player, pos) {
        const div = document.createElement('div');
        if (player) {
            const isC = player.id === captainId;
            const isVc = player.id === viceCaptainId;
            div.className = 'player-card active-player';
            div.innerHTML = `
                ${isC ? '<div class="captain-badge">C</div>' : ''}
                ${isVc ? '<div class="captain-badge" style="background:#bbb">V</div>' : ''}
                <img src="${player.img}" onerror="this.src='${fallbackImg}'">
                <span class="p-name">${player.name}</span>
                <span class="p-price">£${player.price.toFixed(1)}m</span>
            `;
            div.onclick = () => openModal(player.id);
        } else {
            div.className = 'player-card';
            div.innerHTML = `<span style="font-size:24px; color:var(--fpl-green); margin-top:10px;">+</span><span style="font-size:10px; color:#aaa">${pos}</span>`;
            div.onclick = () => { setPosFilter(pos); switchPage('market'); };
        }
        return div;
    }

    /* Fully Functional AI Logic */
    function generateAISquad() {
        if (!playersDB.length) return alert('جاري مزامنة قاعدة البيانات، حاول بعد ثوانٍ...');

        activeSquad = []; remainingBudget = 100.0; captainId = null; viceCaptainId = null;
        const limits = { 'GKP': 2, 'DEF': 5, 'MID': 5, 'FWD': 3 };
        const counts = { 'GKP': 0, 'DEF': 0, 'MID': 0, 'FWD': 0 };

        let sorted = [...playersDB].sort((a, b) => b.score - a.score);

        for (let p of sorted) {
            if (activeSquad.length >= 15) break;

            let clubCount = activeSquad.filter(x => x.club === p.club).length;
            if (counts[p.pos] < limits[p.pos] && clubCount < 3 && remainingBudget >= p.price) {
                if ((15 - activeSquad.length - 1) === 0 || (remainingBudget - p.price) >= ((14 - activeSquad.length) * 4.0)) {
                    activeSquad.push(p);
                    counts[p.pos]++;
                    remainingBudget -= p.price;
                }
            }
        }

        if (activeSquad.length > 0) captainId = activeSquad[0].id;
        if (activeSquad.length > 1) viceCaptainId = activeSquad[1].id;

        updateHUD();
        renderPitch();
    }

    function togglePlayer(id) {
        const player = playersDB.find(x => x.id === id);
        if (!player) return;

        const idx = activeSquad.findIndex(x => x.id === id);
        if (idx > -1) {
            remainingBudget += activeSquad[idx].price;
            if (captainId === id) captainId = null;
            if (viceCaptainId === id) viceCaptainId = null;
            activeSquad.splice(idx, 1);
        } else {
            if (activeSquad.length >= 15) return alert('التشكيلة مكتملة بـ 15 لاعباً!');
            if (remainingBudget < player.price) return alert('الميزانية لا تكفي!');
            if (activeSquad.filter(x => x.club === player.club).length >= 3) return alert('الحد الأقصى 3 لاعبين من نفس الفريق!');

            activeSquad.push(player);
            remainingBudget -= player.price;
        }

        updateHUD();
        renderPitch();
        renderMarket();
    }

    function updateHUD() {
        document.getElementById('budgetText').innerText = '£' + remainingBudget.toFixed(1) + 'm';
        document.getElementById('countText').innerText = activeSquad.length + '/15';
    }

    function setPosFilter(pos) {
        currentFilter = pos;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText.includes(pos) || (pos === 'ALL' && btn.innerText.includes('الكل')));
        });
        renderMarket();
    }

    function renderMarket() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const container = document.getElementById('marketList');
        if (!container) return;
        container.innerHTML = '';

        const list = playersDB.filter(x => {
            const matchQ = x.name.toLowerCase().includes(q) || x.club.toLowerCase().includes(q);
            const matchP = currentFilter === 'ALL' || x.pos === currentFilter;
            return matchQ && matchP;
        });

        list.slice(0, 80).forEach(p => {
            const added = activeSquad.some(x => x.id === p.id);
            const card = document.createElement('div');
            card.className = 'market-card';
            card.innerHTML = `
                <img src="${p.img}" onerror="this.src='${fallbackImg}'">
                <div class="market-info">
                    <h4>${p.name}</h4>
                    <p>${p.club} | <b style="color:var(--fpl-green);">${p.pos}</b> | النقاط: ${p.pts}</p>
                </div>
                <div>
                    <span style="font-weight:bold; font-size:13px; margin-left:8px;">£${p.price.toFixed(1)}m</span>
                    <button class="action-btn ${added ? 'remove' : ''}" onclick="togglePlayer(${p.id})">${added ? 'إزالة' : '+'}</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function openModal(id) {
        selectedPlayerId = id;
        const p = activeSquad.find(x => x.id === id);
        if (!p) return;
        document.getElementById('modalPlayerName').innerText = p.name;
        document.getElementById('playerModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('playerModal').style.display = 'none'; }

    function setCaptain(type) {
        if (type === 'C') { captainId = selectedPlayerId; if (viceCaptainId === selectedPlayerId) viceCaptainId = null; }
        else { viceCaptainId = selectedPlayerId; if (captainId === selectedPlayerId) captainId = null; }
        closeModal();
        renderPitch();
    }

    function removeFromSquad() {
        togglePlayer(selectedPlayerId);
        closeModal();
    }
</script>
</body>
</html>
