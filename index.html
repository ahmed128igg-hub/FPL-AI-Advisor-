<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPL Official Ultimate Manager 2026/27</title>
    <link href="https://fonts.googleapis.com/css2?family=Premier+League&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --fpl-purple: #37003c;
            --fpl-green: #00ff87;
            --fpl-pink: #e90052;
            --fpl-bg: #ebff21;
            --bg-dark: #1e002b;
            --card-bg: #2d003b;
            --text-light: #ffffff;
            --fdr-easy: #00ff87;
            --fdr-med: #e1e1e1;
            --fdr-hard: #ff1744;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* Top Bar */
        header {
            background: var(--fpl-purple);
            border-bottom: 4px solid var(--fpl-green);
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title-area h1 {
            margin: 0;
            font-size: 22px;
            color: var(--fpl-green);
        }

        .hud-stats {
            display: flex;
            gap: 20px;
        }

        .stat-badge {
            background: rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-badge label {
            display: block;
            font-size: 11px;
            color: #ccc;
        }

        .stat-badge val {
            font-size: 18px;
            font-weight: bold;
            color: var(--fpl-green);
        }

        /* AI Button */
        .btn-ai {
            background: linear-gradient(45deg, #00ff87, #0288d1);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,255,135,0.3);
            transition: 0.2s;
        }

        .btn-ai:hover { transform: scale(1.03); }

        /* Main Grid Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
        }

        /* Clubs Menu */
        .clubs-panel {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            height: 600px;
            overflow-y: auto;
        }

        .club-item-btn {
            width: 100%;
            background: #1b0024;
            color: white;
            border: 1px solid #4a0052;
            padding: 12px;
            margin-bottom: 6px;
            border-radius: 6px;
            text-align: right;
            font-weight: bold;
            cursor: pointer;
        }

        .club-item-btn:hover, .club-item-btn.active {
            background: var(--fpl-purple);
            border-color: var(--fpl-green);
            color: var(--fpl-green);
        }

        /* Players Table Panel */
        .table-panel {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            height: 600px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th {
            background: var(--fpl-purple);
            color: #ccc;
            padding: 10px;
            position: sticky;
            top: 0;
            font-size: 13px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #4a0052;
            font-size: 14px;
        }

        .fdr-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
            color: #000;
        }

        .fdr-1, .fdr-2 { background: var(--fdr-easy); }
        .fdr-3 { background: var(--fdr-med); }
        .fdr-4, .fdr-5 { background: var(--fdr-hard); color: #fff; }

        .btn-select {
            background: var(--fpl-green);
            color: #000;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-select.selected {
            background: var(--fpl-pink);
            color: #fff;
        }

        /* Realistic Pitch UI */
        .pitch-container {
            margin-top: 20px;
            background: #008744;
            background-image: linear-gradient(to bottom, #008744 50%, #007038 50%);
            background-size: 100% 60px;
            border: 3px solid #fff;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .pitch-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .player-card {
            background: var(--fpl-purple);
            border: 1px solid var(--fpl-green);
            border-radius: 8px;
            width: 100px;
            padding: 8px 5px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .player-card img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #fff;
            object-fit: cover;
        }

        .player-card .p-name {
            display: block;
            font-size: 11px;
            font-weight: bold;
            margin-top: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-card .p-price {
            font-size: 10px;
            color: var(--fpl-green);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="title-area">
            <h1>⚡ FPL Official Ultimate 2026/27</h1>
        </div>
        <div class="hud-stats">
            <div class="stat-badge">
                <label>الميزانية المتبقية</label>
                <val id="budgetDisplay">£100.0m</val>
            </div>
            <div class="stat-badge">
                <label>التشكيلة</label>
                <val id="countDisplay">0/15</val>
            </div>
            <button class="btn-ai" onclick="generateAISquad()">🤖 تشكيلة الذكاء الاصطناعي</button>
        </div>
    </header>

    <div class="main-layout">
        <!-- الأندية -->
        <div class="clubs-panel" id="clubsList"></div>

        <!-- قائمة اللاعبين الجدول -->
        <div class="table-panel">
            <h3 id="currentClubHeading" style="color: var(--fpl-green); margin-top:0;">اختر نادياً</h3>
            <table>
                <thead>
                    <tr>
                        <th>اللاعب</th>
                        <th>المركز</th>
                        <th>السعر</th>
                        <th>المباراة القادمة (FDR)</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody id="playersTbody">
                    <tr><td colspan="5" style="text-align:center;">حدد نادياً من القائمة لعرض نجومه وبدلاءه بالكامل</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ملعب التشكيلة -->
    <div class="pitch-container">
        <h3 style="margin-top:0; color:#fff;">🏟️ تشكيلة الفريق الأساسية والبدلاء</h3>
        <div class="pitch-grid" id="pitchView">
            <span style="color:#fff;">فريقك فارغ حالياً. اضغط "اختيار" من القوائم أو استخدم زر الذكاء الاصطناعي.</span>
        </div>
    </div>
</div>

<script>
    // قاعدة بيانات محدثة بأسعار 2026 الرسمية مع جدول صعوبة المباريات والصور
    const clubsData = {
        "أرسنال (Arsenal)": [
            { id: 1, name: "دافيد رايا", pos: "GKP", price: 5.5, fdr: "SOU (H)", fdrLevel: 1, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p194632.png" },
            { id: 2, name: "غابرييل ماغالهايس", pos: "DEF", price: 6.0, fdr: "SOU (H)", fdrLevel: 1, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p226597.png" },
            { id: 3, name: "ويليام ساليبا", pos: "DEF", price: 6.0, fdr: "SOU (H)", fdrLevel: 1, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p462424.png" },
            { id: 4, name: "بوكايو ساكا", pos: "MID", price: 10.0, fdr: "SOU (H)", fdrLevel: 1, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p223340.png" },
            { id: 5, name: "مارتن أوديجارد", pos: "MID", price: 8.5, fdr: "SOU (H)", fdrLevel: 1, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p184009.png" },
            { id: 6, name: "فيكتور جيوكيريس", pos: "FWD", price: 9.0, fdr: "SOU (H)", fdrLevel: 1, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p243016.png" },
            { id: 7, name: "ديكلان رايس", pos: "MID", price: 6.5, fdr: "SOU (H)", fdrLevel: 1, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p204480.png" }
        ],
        "مانشستر سيتي (Manchester City)": [
            { id: 8, name: "جانلويجي دوناروما", pos: "GKP", price: 5.5, fdr: "FUL (A)", fdrLevel: 2, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p214104.png" },
            { id: 9, name: "إيرلينج هالاند", pos: "FWD", price: 15.0, fdr: "FUL (A)", fdrLevel: 2, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p223094.png" },
            { id: 10, name: "فيل فودين", pos: "MID", price: 9.0, fdr: "FUL (A)", fdrLevel: 2, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p209244.png" },
            { id: 11, name: "جوسكو جفارديول", pos: "DEF", price: 6.0, fdr: "FUL (A)", fdrLevel: 2, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p477424.png" },
            { id: 12, name: "كيفين دي بروين", pos: "MID", price: 9.5, fdr: "FUL (A)", fdrLevel: 2, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p61366.png" }
        ],
        "تشيلسي (Chelsea)": [
            { id: 13, name: "روبرت سانشيز", pos: "GKP", price: 4.5, fdr: "NFO (H)", fdrLevel: 2, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p215059.png" },
            { id: 14, name: "كول بالمر", pos: "MID", price: 10.5, fdr: "NFO (H)", fdrLevel: 2, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p244851.png" },
            { id: 15, name: "جواو بيدرو", pos: "FWD", price: 7.5, fdr: "NFO (H)", fdrLevel: 2, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p477064.png" },
            { id: 16, name: "ليام ديلاب", pos: "FWD", price: 6.5, fdr: "NFO (H)", fdrLevel: 2, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p463748.png" }
        ],
        "ليفربول (Liverpool)": [
            { id: 17, name: "أليسون بيكر", pos: "GKP", price: 5.5, fdr: "CRY (A)", fdrLevel: 3, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p116535.png" },
            { id: 18, name: "فلوريان فيرتز", pos: "MID", price: 8.5, fdr: "CRY (A)", fdrLevel: 3, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p444141.png" },
            { id: 19, name: "هوگو إيكيتيكي", pos: "FWD", price: 8.5, fdr: "CRY (A)", fdrLevel: 3, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p501160.png" },
            { id: 20, name: "فيرجل فان دايك", pos: "DEF", price: 6.0, fdr: "CRY (A)", fdrLevel: 3, img: "https://resources.premierleague.com/premierleague/photos/players/250x250/p97032.png" }
        ]
    };

    let squad = [];
    let budget = 100.0;

    // Render Clubs Sidebar
    const clubsList = document.getElementById('clubsList');
    Object.keys(clubsData).forEach((club, index) => {
        const btn = document.createElement('button');
        btn.className = 'club-item-btn' + (index === 0 ? ' active' : '');
        btn.innerText = club;
        btn.onclick = () => {
            document.querySelectorAll('.club-item-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderPlayers(club);
        };
        clubsList.appendChild(btn);
    });

    // Render Players
    function renderPlayers(clubName) {
        document.getElementById('currentClubHeading').innerText = clubName;
        const tbody = document.getElementById('playersTbody');
        tbody.innerHTML = '';

        clubsData[clubName].forEach(p => {
            const inSquad = squad.some(item => item.id === p.id);
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${p.name}</strong></td>
                <td><span style="color:var(--fpl-green);">${p.pos}</span></td>
                <td><strong>£${p.price}m</strong></td>
                <td><span class="fdr-badge fdr-${p.fdrLevel}">${p.fdr}</span></td>
                <td>
                    <button class="btn-select ${inSquad ? 'selected' : ''}" onclick="togglePlayer(${p.id}, '${clubName}')">
                        ${inSquad ? 'إزالة' : 'اختيار'}
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Toggle Selection
    function togglePlayer(id, clubName) {
        let playerObj;
        for(let c in clubsData) {
            let found = clubsData[c].find(x => x.id === id);
            if(found) { playerObj = found; break; }
        }

        const idx = squad.findIndex(s => s.id === id);
        if(idx > -1) {
            budget += squad[idx].price;
            squad.splice(idx, 1);
        } else {
            if(squad.length >= 15) { alert("التشكيلة مكتملة (15 لاعب)!"); return; }
            if(budget < playerObj.price) { alert("الميزانية غير كافية!"); return; }
            budget -= playerObj.price;
            squad.push(playerObj);
        }

        updateStats();
        renderPlayers(clubName);
        renderPitch();
    }

    // AI Generator
    function generateAISquad() {
        squad = [];
        budget = 100.0;
        
        let allPlayers = [];
        for(let club in clubsData) {
            allPlayers = allPlayers.concat(clubsData[club]);
        }

        // Sort by value/fdr
        allPlayers.sort((a,b) => a.fdrLevel - b.fdrLevel);

        for(let p of allPlayers) {
            if(squad.length < 15 && budget >= p.price) {
                squad.push(p);
                budget -= p.price;
            }
        }

        updateStats();
        renderPitch();
        const activeClub = document.querySelector('.club-item-btn.active').innerText;
        renderPlayers(activeClub);
    }

    function updateStats() {
        document.getElementById('budgetDisplay').innerText = "£" + budget.toFixed(1) + "m";
        document.getElementById('countDisplay').innerText = squad.length + "/15";
    }

    function renderPitch() {
        const pitch = document.getElementById('pitchView');
        pitch.innerHTML = '';
        if(squad.length === 0) {
            pitch.innerHTML = '<span style="color:#fff;">فريقك فارغ حالياً. اضغط "اختيار" من القوائم أو استخدم زر الذكاء الاصطناعي.</span>';
            return;
        }

        squad.forEach(p => {
            const card = document.createElement('div');
            card.className = 'player-card';
            card.innerHTML = `
                <img src="${p.img}" alt="${p.name}" onerror="this.src='https://resources.premierleague.com/premierleague/photos/players/250x250/Photo-Missing.png'">
                <span class="p-name">${p.name}</span>
                <span class="p-price">£${p.price}m</span>
            `;
            pitch.appendChild(card);
        });
    }

    // Init
    renderPlayers(Object.keys(clubsData)[0]);
</script>

</body>
</html>
