<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPL Official Live Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --fpl-purple: #37003c;
            --fpl-green: #00ff87;
            --fpl-pink: #e90052;
            --bg-dark: #0f0015;
            --card-bg: #1f0027;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            margin: 0;
            padding-bottom: 70px;
        }

        /* Responsive Layout Grid */
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
        }

        header {
            background: var(--fpl-purple);
            border-bottom: 3px solid var(--fpl-green);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0 0 12px 12px;
        }

        header h1 { margin: 0; font-size: 18px; color: var(--fpl-green); }

        .hud-stats { display: flex; gap: 10px; }
        .stat-badge { background: rgba(0,0,0,0.4); padding: 5px 12px; border-radius: 8px; font-size: 13px; border: 1px solid var(--border); }
        .stat-badge span { color: var(--fpl-green); font-weight: bold; }

        /* Responsive Grid: Multi-column on PC, Single-column on Mobile */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        @media (min-width: 900px) {
            .main-layout { grid-template-columns: 1fr 1fr; }
            .bottom-nav { display: none !important; }
            body { padding-bottom: 0; }
            .screen { display: block !important; }
        }

        @media (max-width: 899px) {
            .screen { display: none; }
            .screen.active { display: block; }
        }

        /* Pitch UI */
        .pitch {
            background: #00753a;
            background-image: repeating-linear-gradient(0deg, #00753a, #00753a 40px, #008241 40px, #008241 80px);
            border: 3px solid #ffffff;
            border-radius: 15px;
            padding: 15px 5px;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }

        .pitch-row { display: flex; justify-content: center; gap: 8px; }

        .slot {
            background: rgba(55, 0, 60, 0.85);
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 8px;
            width: 70px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .slot.filled { border: 2px solid var(--fpl-green); background: var(--fpl-purple); }
        .slot img { width: 40px; height: 40px; border-radius: 50%; background: #fff; }
        .slot .name { font-size: 9px; font-weight: bold; margin-top: 3px; max-width: 65px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
        .slot .price { font-size: 8px; color: var(--fpl-green); }
        .remove-btn { position: absolute; top: -5px; left: -5px; background: var(--fpl-pink); color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; }

        /* Market Controls & Player List */
        .market-panel { background: var(--card-bg); border-radius: 12px; padding: 15px; border: 1px solid var(--border); }
        .search-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #4a0052; background: #120019; color: #fff; margin-bottom: 10px; }
        
        .filters-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }
        .f-btn { background: #2a0038; color: #ccc; border: 1px solid #4a0052; padding: 6px 12px; border-radius: 15px; font-size: 11px; cursor: pointer; white-space: nowrap; }
        .f-btn.active { background: var(--fpl-green); color: #000; font-weight: bold; }

        .players-scroll { max-height: 500px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .player-card { background: #14001c; border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
        .p-info { display: flex; align-items: center; gap: 10px; }
        .p-info img { width: 38px; height: 38px; border-radius: 50%; background: #fff; }
        .p-details bold { font-size: 13px; display: block; }
        .p-details small { font-size: 11px; color: #aaa; }
        .add-btn { background: var(--fpl-green); color: #000; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .add-btn.in-squad { background: var(--fpl-pink); color: #fff; }

        /* Bottom Nav Mobile */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--fpl-purple); border-top: 2px solid var(--fpl-green); display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; }
        .nav-tab { display: flex; flex-direction: column; align-items: center; color: #888; font-size: 11px; cursor: pointer; }
        .nav-tab.active { color: var(--fpl-green); font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>⚽ الفانتازي - الربط المباشر</h1>
    <div class="hud-stats">
        <div class="stat-badge">الميزانية: <span id="budget">£100.0m</span></div>
        <div class="stat-badge">اللاعيبة: <span id="count">0/15</span></div>
    </div>
</header>

<div class="app-container">
    <div class="main-layout">
        <!-- Pitch Screen -->
        <div id="squadScreen" class="screen active">
            <div class="pitch" id="pitch"></div>
        </div>

        <!-- Market Screen -->
        <div id="marketScreen" class="screen">
            <div class="market-panel">
                <input type="text" class="search-box" id="search" placeholder="🔍 ابحث عن أي لاعب أو نادٍ..." oninput="filterData()">
                
                <div class="filters-scroll" id="posFilters">
                    <button class="f-btn active" onclick="setPos('ALL')">كل المراكز</button>
                    <button class="f-btn" onclick="setPos('GKP')">حراس (GKP)</button>
                    <button class="f-btn" onclick="setPos('DEF')">دفاع (DEF)</button>
                    <button class="f-btn" onclick="setPos('MID')">وسط (MID)</button>
                    <button class="f-btn" onclick="setPos('FWD')">هجوم (FWD)</button>
                </div>

                <div class="filters-scroll" id="clubFilters"></div>

                <div class="players-scroll" id="playersList">
                    <div style="text-align:center; padding: 20px;">جاري الاتصال بـ fantasy.premierleague.com وسحب كافة اللاعبين... ⏳</div>
                </div>
            </div>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <div class="nav-tab active" id="tabSquad" onclick="switchTab('squad')">
        <div style="font-size: 18px;">🏟️</div>
        <span>التشكيلة</span>
    </div>
    <div class="nav-tab" id="tabMarket" onclick="switchTab('market')">
        <div style="font-size: 18px;">🏃</div>
        <span>اللاعبين</span>
    </div>
</nav>

<script>
    let allPlayers = [];
    let squad = [];
    let budget = 100.0;
    let selectedPos = 'ALL';
    let selectedClub = 'ALL';

    const slotsConfig = [
        { pos: 'GKP', count: 2 },
        { pos: 'DEF', count: 5 },
        { pos: 'MID', count: 5 },
        { pos: 'FWD', count: 3 }
    ];

    // Fetch Live Data directly from FPL Official API
    async function fetchFPLOfficialData() {
        try {
            const res = await fetch('https://corsproxy.io/?https://fantasy.premierleague.com/api/bootstrap-static/');
            const data = await res.json();
            
            const teams = {};
            data.teams.forEach(t => teams[t.id] = t.name);
            const posMap = { 1: 'GKP', 2: 'DEF', 3: 'MID', 4: 'FWD' };

            allPlayers = data.elements.map(p => ({
                id: p.id,
                name: p.web_name,
                fullName: `${p.first_name} ${p.second_name}`,
                club: teams[p.team] || "EPL",
                pos: posMap[p.element_type],
                price: p.now_cost / 10,
                code: p.code,
                img: `https://resources.premierleague.com/premierleague/photos/players/250x250/p${p.code}.png`
            }));

            buildClubFilters(Object.values(teams));
            filterData();
        } catch (e) {
            document.getElementById('playersList').innerHTML = `<div style="text-align:center; color:red;">تعذر الاتصال بالسيرفر. تأكد من الاتصال بالإنترنت.</div>`;
        }
    }

    function buildClubFilters(clubs) {
        const container = document.getElementById('clubFilters');
        container.innerHTML = `<button class="f-btn active" onclick="setClub('ALL')">كل الأندية</button>`;
        clubs.forEach(c => {
            container.innerHTML += `<button class="f-btn" onclick="setClub('${c}')">${c}</button>`;
        });
    }

    function switchTab(tab) {
        document.getElementById('squadScreen').classList.remove('active');
        document.getElementById('marketScreen').classList.remove('active');
        document.getElementById('tabSquad').classList.remove('active');
        document.getElementById('tabMarket').classList.remove('active');

        if(tab === 'squad') {
            document.getElementById('squadScreen').classList.add('active');
            document.getElementById('tabSquad').classList.add('active');
        } else {
            document.getElementById('marketScreen').classList.add('active');
            document.getElementById('tabMarket').classList.add('active');
        }
    }

    function renderPitch() {
        const pitch = document.getElementById('pitch');
        pitch.innerHTML = '';

        slotsConfig.forEach(group => {
            const row = document.createElement('div');
            row.className = 'pitch-row';
            const posPlayers = squad.filter(p => p.pos === group.pos);

            for(let i = 0; i < group.count; i++) {
                const player = posPlayers[i];
                const card = document.createElement('div');

                if(player) {
                    card.className = 'slot filled';
                    card.innerHTML = `
                        <button class="remove-btn" onclick="togglePlayer(${player.id})">✕</button>
                        <img src="${player.img}" onerror="this.src='https://resources.premierleague.com/premierleague/photos/players/250x250/Photo-Missing.png'">
                        <span class="name">${player.name}</span>
                        <span class="price">£${player.price.toFixed(1)}m</span>
                    `;
                } else {
                    card.className = 'slot';
                    card.innerHTML = `<span style="font-size:20px; color:var(--fpl-green);">+</span><span style="font-size:9px; color:#aaa;">${group.pos}</span>`;
                    card.onclick = () => { setPos(group.pos); switchTab('market'); };
                }
                row.appendChild(card);
            }
            pitch.appendChild(row);
        });
    }

    function togglePlayer(id) {
        const p = allPlayers.find(x => x.id === id);
        if(!p) return;

        const index = squad.findIndex(x => x.id === id);
        if(index > -1) {
            budget += p.price;
            squad.splice(index, 1);
        } else {
            if(squad.length >= 15) return alert('⚠️ التشكيلة مكتملة بـ 15 لاعب!');
            if(budget < p.price) return alert('⚠️ الميزانية غير كافية!');
            
            const posCount = squad.filter(x => x.pos === p.pos).length;
            const maxPos = slotsConfig.find(x => x.pos === p.pos).count;
            if(posCount >= maxPos) return alert(`⚠️ هذا المركز مكتمل (${p.pos})`);

            const clubCount = squad.filter(x => x.club === p.club).length;
            if(clubCount >= 3) return alert(`⚠️ الحد الأقصى 3 لاعبين من ${p.club}`);

            squad.push(p);
            budget -= p.price;
        }

        document.getElementById('budget').innerText = `£${budget.toFixed(1)}m`;
        document.getElementById('count').innerText = `${squad.length}/15`;
        renderPitch();
        filterData();
    }

    function setPos(pos) {
        selectedPos = pos;
        document.querySelectorAll('#posFilters .f-btn').forEach(b => {
            b.classList.toggle('active', b.innerText.includes(pos) || (pos==='ALL' && b.innerText==='كل المراكز'));
        });
        filterData();
    }

    function setClub(club) {
        selectedClub = club;
        document.querySelectorAll('#clubFilters .f-btn').forEach(b => {
            b.classList.toggle('active', b.innerText === club || (club==='ALL' && b.innerText==='كل الأندية'));
        });
        filterData();
    }

    function filterData() {
        const q = document.getElementById('search').value.toLowerCase();
        const container = document.getElementById('playersList');
        container.innerHTML = '';

        const list = allPlayers.filter(p => {
            const matchQ = p.name.toLowerCase().includes(q) || p.fullName.toLowerCase().includes(q) || p.club.toLowerCase().includes(q);
            const matchPos = selectedPos === 'ALL' || p.pos === selectedPos;
            const matchClub = selectedClub === 'ALL' || p.club === selectedClub;
            return matchQ && matchPos && matchClub;
        });

        if(list.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:15px;">لا يوجد لاعبين مطبقين للبحث</div>`;
            return;
        }

        list.slice(0, 80).forEach(p => {
            const inSquad = squad.some(x => x.id === p.id);
            const card = document.createElement('div');
            card.className = 'player-card';
            card.innerHTML = `
                <div class="p-info">
                    <img src="${p.img}" onerror="this.src='https://resources.premierleague.com/premierleague/photos/players/250x250/Photo-Missing.png'">
                    <div class="p-details">
                        <bold>${p.name}</bold>
                        <small>${p.club} | <b style="color:var(--fpl-green);">${p.pos}</b></small>
                    </div>
                </div>
                <div>
                    <span style="font-weight:bold; margin-left:8px;">£${p.price.toFixed(1)}m</span>
                    <button class="add-btn ${inSquad ? 'in-squad' : ''}" onclick="togglePlayer(${p.id})">
                        ${inSquad ? 'إزالة' : 'إضافة +'}
                    </button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    renderPitch();
    fetchFPLOfficialData();
</script>
</body>
</html>
