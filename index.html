<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FPL AI Pro — Builder & Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0e14;
  --panel: #121824;
  --card: #1a2332;
  --border: #283548;
  --green: #00ff87;
  --purple: #38003c;
  --pink: #e90052;
  --txt: #f1f5f9;
  --muted: #94a3b8;
  --fdr-easy: #007a33;
  --fdr-med: #e2b100;
  --fdr-hard: #e90052;
}
* { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
body { margin: 0; background: var(--bg); color: var(--txt); padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; }

/* Layout Grid */
.main-layout { display: grid; grid-template-columns: 1fr 380px; gap: 20px; }

/* Pitch Style */
.pitch { background: linear-gradient(180deg, #134e29 0%, #0d381d 100%); border: 3px solid #2e7d32; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 15px; position: relative; min-height: 520px; justify-content: space-between; }
.pitch-row { display: flex; justify-content: space-around; align-items: center; }
.pitch-player { background: rgba(0,0,0,0.75); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; text-align: center; width: 100px; font-size: 12px; position: relative; cursor: pointer; transition: 0.2s; }
.pitch-player:hover { border-color: var(--green); transform: scale(1.05); }
.pitch-player strong { display: block; color: var(--green); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Stats Bar */
.budget-bar { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 15px; display: flex; justify-content: space-between; margin-bottom: 20px; }
.b-item span { color: var(--muted); font-size: 13px; display: block; }
.b-item strong { font-size: 20px; color: var(--green); }

/* Player Cards Grid */
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
.card-top { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; }

/* FDR Fixtures */
.fixtures { display: flex; gap: 4px; margin-top: 8px; }
.fix-box { flex: 1; text-align: center; padding: 4px; border-radius: 4px; font-size: 10px; font-weight: bold; color: #fff; }
.fix-easy { background: var(--fdr-easy); }
.fix-med { background: var(--fdr-med); color: #000; }
.fix-hard { background: var(--fdr-hard); }

.btn-add { background: var(--green); color: #000; border: 0; border-radius: 6px; padding: 4px 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; }
.btn-add:hover { background: #00cc6a; }

@media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="container">
  <div class="budget-bar">
    <div class="b-item"><span>الميزانية المتبقية</span><strong id="remBudget">100.0m</strong></div>
    <div class="b-item"><span>النقاط المتوقعة للجولة (xP)</span><strong id="totalXp">0.0</strong></div>
    <div class="b-item"><span>اللاعبين المختارين</span><strong id="teamCount">0 / 11</strong></div>
  </div>

  <div class="main-layout">
    <div>
      <h3 style="margin-top:0">تطبيق ترشيحات وبناء تشكيلة الفنتازي</h3>
      <div class="cards-grid" id="playersMarket"></div>
    </div>

    <div>
      <h3 style="margin-top:0">ملعب التشكيلة الخاصة بك</h3>
      <div class="pitch">
        <div class="pitch-row" id="rowFWD"></div>
        <div class="pitch-row" id="rowMID"></div>
        <div class="pitch-row" id="rowDEF"></div>
        <div class="pitch-row" id="rowGKP"></div>
      </div>
    </div>
  </div>
</div>

<script>
// قاعدة بيانات متكاملة بجدول المباريات (Fixtures & FDR)
const database = [
  { id: 1, name: "Haaland", team: "MCI", pos: "FWD", price: 15.0, xP: 9.2, fix: [{opp:"BHA (H)", r:1}, {opp:"ARS (A)", r:3}, {opp:"NFO (H)", r:1}] },
  { id: 2, name: "Salah", team: "LIV", pos: "MID", price: 12.5, xP: 8.7, fix: [{opp:"EVE (H)", r:1}, {opp:"CHE (A)", r:2}, {opp:"TOT (H)", r:2}] },
  { id: 3, name: "Saka", team: "ARS", pos: "MID", price: 10.0, xP: 7.9, fix: [{opp:"WHU (H)", r:1}, {opp:"MCI (H)", r:3}, {opp:"FUL (A)", r:1}] },
  { id: 4, name: "Trossard", team: "ARS", pos: "MID", price: 7.0, xP: 6.9, fix: [{opp:"WHU (H)", r:1}, {opp:"MCI (H)", r:3}, {opp:"FUL (A)", r:1}] },
  { id: 5, name: "Isak", team: "NEW", pos: "FWD", price: 8.5, xP: 7.1, fix: [{opp:"BOU (A)", r:2}, {opp:"WOL (H)", r:1}, {opp:"LIV (A)", r:3}] },
  { id: 6, name: "João Pedro", team: "BHA", pos: "FWD", price: 5.5, xP: 6.3, fix: [{opp:"MCI (A)", r:3}, {opp:"CRY (H)", r:1}, {opp:"BUR (A)", r:1}] },
  { id: 7, name: "Calafiori", team: "ARS", pos: "DEF", price: 5.8, xP: 5.8, fix: [{opp:"WHU (H)", r:1}, {opp:"MCI (H)", r:3}, {opp:"FUL (A)", r:1}] },
  { id: 8, name: "Gvardiol", team: "MCI", pos: "DEF", price: 6.0, xP: 6.1, fix: [{opp:"BHA (H)", r:1}, {opp:"ARS (A)", r:3}, {opp:"NFO (H)", r:1}] },
  { id: 9, name: "Raya", team: "ARS", pos: "GKP", price: 5.5, xP: 5.2, fix: [{opp:"WHU (H)", r:1}, {opp:"MCI (H)", r:3}, {opp:"FUL (A)", r:1}] }
];

let mySquad = [];

function renderMarket() {
  const container = document.getElementById('playersMarket');
  container.innerHTML = database.map(p => {
    const isAdded = mySquad.some(x => x.id === p.id);
    return `
      <div class="card">
        <div class="card-top">
          <span>${p.name} (${p.team})</span>
          <span style="color:var(--green)">${p.price}m</span>
        </div>
        <small style="color:var(--muted)">المركز: ${p.pos} | xP المتوقع: <b>${p.xP}</b></small>
        
        <div class="fixtures">
          ${p.fix.map(f => `<div class="fix-box ${f.r===1?'fix-easy':f.r===2?'fix-med':'fix-hard'}">${f.opp}</div>`).join('')}
        </div>

        <button class="btn-add" onclick="togglePlayer(${p.id})" style="${isAdded?'background:var(--pink);color:#fff':''}">
          ${isAdded ? 'إزالة من الفريق' : '+ إضافة للتشكيلة'}
        </button>
      </div>
    `;
  }).join('');
}

function togglePlayer(id) {
  const p = database.find(x => x.id === id);
  const index = mySquad.findIndex(x => x.id === id);

  if (index > -1) {
    mySquad.splice(index, 1);
  } else {
    if (mySquad.length >= 11) return alert("مسموح باختيار 11 لاعب فقط!");
    mySquad.push(p);
  }
  updateSquad();
  renderMarket();
}

function updateSquad() {
  const spent = mySquad.reduce((s, p) => s + p.price, 0);
  const totalXp = mySquad.reduce((s, p) => s + p.xP, 0);
  
  document.getElementById('remBudget').innerText = (100 - spent).toFixed(1) + 'm';
  document.getElementById('totalXp').innerText = totalXp.toFixed(1);
  document.getElementById('teamCount').innerText = `${mySquad.length} / 11`;

  const posMap = { FWD: 'rowFWD', MID: 'rowMID', DEF: 'rowDEF', GKP: 'rowGKP' };
  Object.values(posMap).forEach(id => document.getElementById(id).innerHTML = '');

  mySquad.forEach(p => {
    const el = document.createElement('div');
    el.className = 'pitch-player';
    el.innerHTML = `<strong>${p.name}</strong><small>${p.price}m</small>`;
    el.onclick = () => togglePlayer(p.id);
    document.getElementById(posMap[p.pos]).appendChild(el);
  });
}

renderMarket();
</script>
</body>
</html>
