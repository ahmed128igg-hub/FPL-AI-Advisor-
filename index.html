<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPL Ultimate Manager 2026/27</title>
    <link href="https://fonts.googleapis.com/css2?family=Premier+League&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --fpl-purple: #37003c;
            --fpl-green: #00ff87;
            --fpl-pink: #e90052;
            --fpl-bg: #ebff21;
            --bg-dark: #12001a;
            --card-bg: #22002a;
            --text-light: #ffffff;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { margin: 0; background-color: var(--bg-dark); color: var(--text-light); padding: 15px; }
        .container { max-width: 1400px; margin: 0 auto; }

        /* Top Bar */
        header { background: var(--fpl-purple); border-bottom: 4px solid var(--fpl-green); padding: 15px 25px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .brand-box h1 { margin: 0; font-size: 22px; color: #fff; }
        .hud-stats { display: flex; gap: 15px; }
        .stat-badge { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 10px; text-align: center; }
        .stat-badge label { display: block; font-size: 11px; color: var(--text-muted); }
        .stat-badge val { font-size: 20px; color: var(--fpl-green); font-weight: 900; }

        /* Main Grid */
        .workspace { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
        @media(max-width: 1000px) { .workspace { grid-template-columns: 1fr; } }

        /* Sidebar Clubs */
        .panel { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 15px; }
        .panel-title { margin: 0 0 12px; font-size: 16px; color: var(--green); display: flex; align-items: center; justify-content: space-between; }
        
        .clubs-container { max-height: 600px; overflow-y: auto; padding-left: 5px; }
        .club-btn { width: 100%; background: #1a001e; color: #fff; border: 1px solid #3c0047; padding: 12px; margin-bottom: 8px; border-radius: 10px; text-align: right; cursor: pointer; font-weight: 700; transition: 0.2s; }
        .club-btn:hover, .club-btn.active { background: var(--fpl-purple); border-color: var(--fpl-green); color: var(--fpl-green); }

        /* Players List */
        .content-area { height: 630px; overflow-y: auto; padding-left: 5px; }
        .club-heading { margin: 0 0 15px; color: var(--fpl-green); font-size: 20px; font-weight: 900; }
        
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th { background: #1a0836; color: var(--text-muted); padding: 12px 10px; font-size: 13px; position: sticky; top: 0; }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .player-name { font-weight: 700; font-size: 15px; }
        .player-pos { color: var(--fpl-green); font-size: 12px; font-weight: 700; }
        .player-price { color: var(--fpl-pink); font-weight: 900; font-size: 15px; }
        .add-btn { background: var(--fpl-green); color: #000; border: 0; padding: 7px 15px; border-radius: 8px; font-weight: 900; cursor: pointer; }
        .add-btn.remove { background: var(--fpl-pink); color: #fff; }
    </style>
</head>

<div class="container">

            { id: 1008, name: "زوما", pos: "دفاع (DEF)", price: 4.5 },
            { id: 1009, name: "باكيتا", pos: "MID", price: 6.0 },
            { id: 1010, name: "سومجيك", pos: "MID", price: 5.0 },
            { id: 1011, name: "فابيانسكي", pos: "GKP", price: 4.0 },
            { id: 1012, name: "مافروبانوس", pos: "DEF", price: 4.5 },
            { id: 1013, name: "وان بيساكا", pos: "DEF", price: 4.5 },
            { id: 1014, name: "ألفاريز", pos: "MID", price: 4.8 },
            { id: 1015, name: "وارد پروز", pos: "MID", price: 6.1 },
            { id: 1016, name: "رودريغيز", pos: "MID", price: 5.0 },
            { id: 1017, name: "أنتونيو", pos: "FWD", price: 5.3 },
            { id: 1018, name: "إينغز", pos: "FWD", price: 5.1 },
            { id: 1019, name: "غويلرمي", pos: "MID", price: 5.0 },
            { id: 1020, name: "سامرفيل", pos: "MID", price: 6.0 }
        ]
    };

    let userSquad = [];
    let currentBudget = 100.0;

    // توليد الأندية في القائمة الجانبية
    const clubsSidebar = document.getElementById('clubsSidebar');
    Object.keys(detailedDatabase).forEach((club, index) => {
        const btn = document.createElement('button');
        btn.className = 'club-btn' + (index === 0 ? ' active' : '');
        btn.innerHTML = `
            <span>${club}</span>
            <small style="color:var(--text-muted);">${detailedDatabase[club].length} لاعب</small>
        `;
        btn.onclick = () => {
            document.querySelectorAll('.club-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            displayPlayers(club);
        };
        clubsSidebar.appendChild(btn);
    });

    // عرض لاعبي النادي المختار (القائمة الكاملة)
    function displayPlayers(clubName) {
        document.getElementById('currentClubName').innerText = "قائمة نادي: " + clubName;
        const tbody = document.getElementById('playersTableBody');
        tbody.innerHTML = '';
        
        detailedDatabase[clubName].forEach(player => {
            const isAdded = userSquad.some(p => p.id === player.id);
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="player-name">${player.name}</span></td>
                <td><span class="player-pos">${player.pos}</span></td>
                <td><span class="player-price">£${player.price}m</span></td>
                <td><button class="add-btn ${isAdded ? 'remove' : ''}" onclick='togglePlayer(${player.id}, ${player.price}, "${clubName}")'>${isAdded ? 'إزالة' : 'اختيار'}</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // إضافة أو إزالة اللاعب من التشكيلة
    function togglePlayer(id, price, currentClub) {
        // البحث عن اللاعب في قاعدة البيانات الكبيرة
        let playerObj = null;
        for (let club in detailedDatabase) {
            playerObj = detailedDatabase[club].find(p => p.id === id);
            if (playerObj) break;
        }

        const index = userSquad.findIndex(p => p.id === id);

        if (index > -1) {
            // إزالة
            currentBudget += price;
            userSquad.splice(index, 1);
        } else {
            // إضافة
            if (userSquad.length >= 15) {
                alert("⚠️ لقد وصلت للحد الأقصى للتشكيلة (15 لاعب)!");
                return;
            }
            if (currentBudget < price) {
                alert("⚠️ عذراً، الميزانية لا تكفي لشراء هذا اللاعب!");
                return;
            }
            currentBudget -= price;
            userSquad.push(playerObj);
        }

        updateHUD();
        displayPlayers(currentClub); // تحديث الأزرار في الجدول
    }

    function updateHUD() {
        document.getElementById('budgetVal').innerText = currentBudget.toFixed(1) + "m";
        document.getElementById('countVal').innerText = userSquad.length + "/15";
    }

    // عرض أول نادي افتراضياً
    displayPlayers(Object.keys(detailedDatabase)[0]);
</script>
