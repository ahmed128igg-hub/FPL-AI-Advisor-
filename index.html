<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FPL Pro Engine v5.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #02efff;
            --accent: #ff0055;
            --bg-main: #0b0214;
            --bg-card: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; user-select: none; }

        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 75px; overflow-x: hidden; }

        /* Full Auth Gateway */
        #auth-gate {
            position: fixed; inset: 0; background: #05000a; z-index: 50000;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }

        .auth-box {
            background: rgba(20, 5, 30, 0.95); border: 2px solid var(--primary);
            box-shadow: 0 0 35px rgba(2, 239, 255, 0.25); border-radius: 20px;
            padding: 30px 20px; width: 100%; max-width: 380px; text-align: center;
        }

        .auth-box h2 { color: var(--primary); font-size: 22px; margin-bottom: 5px; font-weight: 900; }
        .auth-box p { color: #888; font-size: 12px; margin-bottom: 20px; }

        .auth-input {
            width: 100%; padding: 13px; margin-bottom: 12px; border-radius: 10px;
            border: 1px solid var(--border); background: rgba(255, 255, 255, 0.05);
            color: #fff; font-size: 14px; outline: none; transition: 0.3s;
        }
        .auth-input:focus { border-color: var(--primary); background: rgba(255, 255, 255, 0.1); }

        .auth-btn {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            background: linear-gradient(135deg, var(--primary), #0088ff);
            color: #000; font-weight: 900; font-size: 15px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(2, 239, 255, 0.4); margin-top: 5px;
        }

        /* Top Bar & Stats */
        header {
            background: rgba(15, 2, 25, 0.9); backdrop-filter: blur(12px);
            border-bottom: 2px solid var(--primary); padding: 12px 16px;
            position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center;
        }

        .brand { font-size: 18px; font-weight: 900; color: var(--primary); letter-spacing: 1px; }

        .hud-wrapper { display: flex; gap: 8px; }
        .hud-item {
            background: var(--bg-card); border: 1px solid var(--border);
            padding: 5px 10px; border-radius: 8px; font-size: 11px; text-align: center;
        }
        .hud-item span { color: var(--primary); font-weight: bold; }

        .container { max-width: 800px; margin: 0 auto; padding: 12px; }
        .page { display: none; }
        .page.active { display: block; }

        /* Powerful AI Action Button */
        .btn-ai-v3 {
            width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #ff0055, #7a00ff); color: #fff;
            font-size: 14px; font-weight: 900; cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 0, 85, 0.4); transition: transform 0.2s;
        }
        .btn-ai-v3:active { transform: scale(0.98); }

        /* Redesigned Modern Pitch */
        .pitch-container {
            background: radial-gradient(circle at center, #1b4d24 0%, #08210d 100%);
            border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 18px;
            padding: 15px 5px; min-height: 480px; display: flex; flex-direction: column;
            justify-content: space-between; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .pitch-line {
            position: absolute; top: 50%; left: 0; right: 0; height: 2px;
            background: rgba(255,255,255,0.2); pointer-events: none;
        }

        .pitch-row { display: flex; justify-content: center; gap: 6px; z-index: 5; }

        .bench-container {
            background: rgba(10, 2, 15, 0.95); border: 1px solid var(--border);
            border-radius: 14px; padding: 12px; margin-top: 15px;
        }
        .bench-title { font-size: 12px; color: var(--primary); text-align: center; font-weight: bold; margin-bottom: 10px; }

        /* Player Slots */
        .slot-card {
            background: rgba(25, 5, 35, 0.9); border: 1px solid var(--border);
            border-radius: 10px; width: 20%; max-width: 72px; min-width: 58px; height: 100px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 5px; cursor: pointer; position: relative; transition: 0.2s;
        }
        .slot-card.filled { border-color: var(--primary); background: rgba(10, 25, 40, 0.95); }
        .slot-card img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,0.1); }
        .slot-card .name { font-size: 9px; font-weight: bold; width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .slot-card .price { font-size: 8px; color: var(--primary); font-weight: bold; }

        .c-badge {
            position: absolute; top: -5px; right: -5px; background: #ffcc00; color: #000;
            font-weight: 900; font-size: 9px; width: 18px; height: 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; border: 1px solid #000;
        }

        /* Database Market & Filters */
        .search-bar {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.06); color: #fff; font-size: 14px; outline: none; margin-bottom: 12px;
        }
        .search-bar:focus { border-color: var(--primary); }

        .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 15px; }
        .f-btn {
            background: var(--bg-card); color: #aaa; border: 1px solid var(--border);
            padding: 8px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap;
        }
        .f-btn.active { background: var(--primary); color: #000; font-weight: 900; }

        .market-item {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            padding: 12px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between;
        }
        .market-item img { width: 45px; height: 45px; border-radius: 50%; background: #fff; }
        .market-info { flex: 1; margin: 0 12px; }
        .market-info h4 { font-size: 14px; color: #fff; }
        .market-info p { font-size: 11px; color: #aaa; }

        .add-btn {
            background: var(--primary); color: #000; border: none; padding: 8px 16px;
            border-radius: 8px; font-weight: 900; cursor: pointer;
        }
        .add-btn.remove { background: var(--accent); color: #fff; }

        /* Navigation Bar */
        .navbar {
            position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10, 2, 15, 0.98);
            border-top: 1px solid var(--border); display: flex; justify-content: space-around;
            padding: 10px 0; z-index: 2000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #666; font-size: 10px; cursor: pointer; }
        .nav-item.active { color: var(--primary); font-weight: bold; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; }
        .modal-card { background: #120320; border: 2px solid var(--primary); border-radius: 16px; padding: 20px; width: 85%; max-width: 320px; text-align: center; }
        .m-btn { width: 100%; padding: 12px; margin: 6px 0; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<!-- User Auth Screen -->
<div id="auth-gate">
    <div class="auth-box">
        <h2>تسجيل الدخول / حساب جديد</h2>
        <p>ادخل بياناتك للربط بقاعدة بيانات الفانتازي المباشرة</p>
        <input type="text" id="usernameInput" class="auth-input" placeholder="اسم المستخدم (Username)">
        <input type="password" id="passwordInput" class="auth-input" placeholder="كلمة المرور (Password)">
        <button class="auth-btn" onclick="authenticateUser()">دخول النظام ⚡</button>
    </div>
</div>

<header>
    <div class="brand">⚡ FPL PRO v5</div>
    <div class="hud-wrapper">
        <div class="hud-item">الميزانية: <span id="budgetText">£100.0m</span></div>
        <div class="hud-item">الفرق: <span id="countText">0/15</span></div>
    </div>
</header>

<div class="container">

    <!-- Squad Pitch View -->
    <div id="squadPage" class="page active">
        <button class="btn-ai-v3" onclick="runAdvancedAIEngine()">🤖 توليد أحدث تشكيلة بالذكاء الاصطناعي الخارق</button>
        <div class="pitch-container" id="pitchLayout">
            <div class="pitch-line"></div>
        </div>
        <div class="bench-container">
            <div class="bench-title">دكة البدلاء (4 لاعبين)</div>
            <div class="pitch-row" id="benchLayout"></div>
        </div>
    </div>

    <!-- Live Market View -->
    <div id="marketPage" class="page">
        <input type="text" id="searchInput" class="search-bar" placeholder="🔍 بحث في قاعدة البيانات الرسمية باللاعب أو الفريق..." oninput="renderMarket()">
        <div class="filters">
            <button class="f-btn active" onclick="setPosFilter('ALL')">الكل (600+)</button>
            <button class="f-btn" onclick="setPosFilter('GKP')">حراس (GKP)</button>
            <button class="f-btn" onclick="setPosFilter('DEF')">دفاع (DEF)</button>
            <button class="f-btn" onclick="setPosFilter('MID')">وسط (MID)</button>
            <button class="f-btn" onclick="setPosFilter('FWD')">هجوم (FWD)</button>
        </div>
        <div id="marketList"></div>
    </div>

    <!-- User Profile Screen -->
    <div id="userPage" class="page">
        <div class="bench-container" style="text-align: center;">
            <h3 style="color:var(--primary); margin-bottom: 10px;">👤 الحساب الشخصي المسجل</h3>
            <p id="userDisplay" style="margin-bottom: 15px; font-size: 14px; color: #ccc;"></p>
            <button class="m-btn" style="background:var(--accent); color:#fff;" onclick="logout()">تسجيل الخروج</button>
        </div>
    </div>

</div>

<!-- Player Options Modal -->
<div class="modal-overlay" id="playerModal">
    <div class="modal-card">
        <h3 id="modalPlayerName" style="color:var(--primary); margin-bottom:15px;"></h3>
        <button class="m-btn" style="background:var(--primary); color:#000;" onclick="setCaptain('C')">تعيين كابتن (C)</button>
        <button class="m-btn" style="background:#ddd; color:#000;" onclick="setCaptain('VC')">تعيين نائب كابتن (VC)</button>
        <button class="m-btn" style="background:var(--accent); color:#fff;" onclick="removeFromSquad()">إزالة اللاعب</button>
        <button class="m-btn" style="background:#333; color:#fff;" onclick="closeModal()">إغلاق</button>
    </div>
</div>

<nav class="navbar">
    <div class="nav-item active" id="btnSquad" onclick="switchPage('squad')">
        <div style="font-size:18px;">🏟️</div>
        <span>التشكيلة</span>
    </div>
    <div class="nav-item" id="btnMarket" onclick="switchPage('market')">
        <div style="font-size:18px;">🔍</div>
        <span>الانتقالات المباشرة</span>
    </div>
    <div class="nav-item" id="btnUser" onclick="switchPage('user')">
        <div style="font-size:18px;">⚙️</div>
        <span>حسابي</span>
    </div>
</nav>

<script>
    let rawDatabase = [];
    let activeSquad = [];
    let remainingBudget = 100.0;
    let currentPosFilter = 'ALL';
    let selectedPlayerId = null;
    let captainId = null;
    let viceCaptainId = null;

    const pitchFormation = [
        { pos: 'GKP', count: 1 },
        { pos: 'DEF', count: 4 },
        { pos: 'MID', count: 4 },
        { pos: 'FWD', count: 2 }
    ];

    const fallbackImage = "https://upload.wikimedia.org/wikipedia/en/f/f2/Premier_League_Logo.svg";

    window.addEventListener('DOMContentLoaded', () => {
        const currentUser = localStorage.getItem('fpl_v5_user');
        if (currentUser) {
            document.getElementById('auth-gate').style.display = 'none';
            document.getElementById('userDisplay').innerText = `المستخدم: ${currentUser}`;
            loadCompleteDatabase();
        }
    });

    function authenticateUser() {
        const u = document.getElementById('usernameInput').value.trim();
        const p = document.getElementById('passwordInput').value.trim();
        if (!u || !p) return alert('برجاء كتابة اسم المستخدم وكلمة المرور!');

        localStorage.setItem('fpl_v5_user', u);
        document.getElementById('userDisplay').innerText = `المستخدم: ${u}`;
        document.getElementById('auth-gate').style.display = 'none';
        loadCompleteDatabase();
    }

    function logout() {
        localStorage.removeItem('fpl_v5_user');
        location.reload();
    }

    // Direct fetch for 100% of players from FPL Official API
    async function loadCompleteDatabase() {
        const target = 'https://fantasy.premierleague.com/api/bootstrap-static/';
        const proxies = [
            `https://corsproxy.io/?${encodeURIComponent(target)}`,
            `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`
        ];

        for (let p of proxies) {
            try {
                const res = await fetch(p);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.elements && data.elements.length > 0) {
                        parseFullDatabase(data);
                        return;
                    }
                }
            } catch (e) {
                console.warn('Proxy retry...');
            }
        }
        alert('حدث خطأ في جلب قاعدة البيانات المباشرة. يرجى إعادة المحاولة.');
    }

    function parseFullDatabase(data) {
        let teamMapping = {};
        data.teams.forEach(t => teamMapping[t.id] = t.name);
        const positionMapping = { 1: 'GKP', 2: 'DEF', 3: 'MID', 4: 'FWD' };

        rawDatabase = data.elements.map(item => ({
            id: item.id,
            name: item.web_name,
            fullName: `${item.first_name} ${item.second_name}`,
            club: teamMapping[item.team] || 'EPL Club',
            pos: positionMapping[item.element_type],
            price: item.now_cost / 10,
            pts: item.total_points,
            xMetric: (item.total_points * 0.6) + ((item.now_cost / 10) * 0.4), // Advanced algorithm metric
            img: `https://resources.premierleague.com/premierleague/photos/players/250x250/p${item.code}.png`
        }));

        renderPitch();
        renderMarket();
    }

    function switchPage(pageName) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

        document.getElementById(pageName + 'Page').classList.add('active');
        const btnId = 'btn' + pageName.charAt(0).toUpperCase() + pageName.slice(1);
        document.getElementById(btnId).classList.add('active');
    }

    function renderPitch() {
        const pitch = document.getElementById('pitchLayout');
        const bench = document.getElementById('benchLayout');
        pitch.innerHTML = '<div class="pitch-line"></div>';
        bench.innerHTML = '';

        let starters = activeSquad.slice(0, 11);
        pitchFormation.forEach(group => {
            const row = document.createElement('div');
            row.className = 'pitch-row';
            const positionStarters = starters.filter(x => x.pos === group.pos);

            for (let i = 0; i < group.count; i++) {
                row.appendChild(createSlotElement(positionStarters[i], group.pos));
            }
            pitch.appendChild(row);
        });

        let benchSquad = activeSquad.slice(11, 15);
        const benchPositions = ['GKP', 'DEF', 'MID', 'FWD'];
        for (let i = 0; i < 4; i++) {
            bench.appendChild(createSlotElement(benchSquad[i], benchPositions[i]));
        }
    }

    function createSlotElement(player, pos) {
        const card = document.createElement('div');
        if (player) {
            const isCap = player.id === captainId;
            const isVc = player.id === viceCaptainId;
            card.className = 'slot-card filled';
            card.innerHTML = `
                ${isCap ? '<div class="c-badge">C</div>' : ''}
                ${isVc ? '<div class="c-badge" style="background:#aaa">V</div>' : ''}
                <img src="${player.img}" onerror="this.src='${fallbackImage}'">
                <span class="name">${player.name}</span>
                <span class="price">£${player.price.toFixed(1)}m</span>
            `;
            card.onclick = () => openModal(player.id);
        } else {
            card.className = 'slot-card';
            card.innerHTML = `<span style="font-size:22px; color:var(--primary)">+</span><span style="font-size:9px; color:#888">${pos}</span>`;
            card.onclick = () => { setPosFilter(pos); switchPage('market'); };
        }
        return card;
    }

    /* AI Pro Optimization Algorithm */
    function runAdvancedAIEngine() {
        if (!rawDatabase.length) return alert('جاري تحضير قاعدة البيانات المباشرة، انتظر ثواني...');
        activeSquad = []; remainingBudget = 100.0; captainId = null; viceCaptainId = null;

        const maxLimits = { 'GKP': 2, 'DEF': 5, 'MID': 5, 'FWD': 3 };
        const currentCounts = { 'GKP': 0, 'DEF': 0, 'MID': 0, 'FWD': 0 };

        let sortedList = [...rawDatabase].sort((a, b) => b.xMetric - a.xMetric);

        for (let player of sortedList) {
            if (activeSquad.length >= 15) break;

            let clubCount = activeSquad.filter(p => p.club === player.club).length;
            if (currentCounts[player.pos] < maxLimits[player.pos] && clubCount < 3 && remainingBudget >= player.price) {
                if ((15 - activeSquad.length - 1) === 0 || (remainingBudget - player.price) >= ((14 - activeSquad.length) * 4.0)) {
                    activeSquad.push(player);
                    currentCounts[player.pos]++;
                    remainingBudget -= player.price;
                }
            }
        }

        if (activeSquad.length > 0) captainId = activeSquad[0].id;
        if (activeSquad.length > 1) viceCaptainId = activeSquad[1].id;

        updateHUD();
        renderPitch();
    }

    function togglePlayerSelection(id) {
        const player = rawDatabase.find(x => x.id === id);
        if (!player) return;

        const index = activeSquad.findIndex(x => x.id === id);
        if (index > -1) {
            remainingBudget += activeSquad[index].price;
            if (captainId === id) captainId = null;
            if (viceCaptainId === id) viceCaptainId = null;
            activeSquad.splice(index, 1);
        } else {
            if (activeSquad.length >= 15) return alert('التشكيلة مكتملة بـ 15 لاعباً!');
            if (remainingBudget < player.price) return alert('الميزانية لا تكفي للشراء!');
            if (activeSquad.filter(x => x.club === player.club).length >= 3) return alert('وصلت للحد الأقصى (3 لاعبين من نفس الفريق)!');

            activeSquad.push(player);
            remainingBudget -= player.price;
        }

        updateHUD();
        renderPitch();
        renderMarket();
    }

    function updateHUD() {
        document.getElementById('budgetText').innerText = '£' + remainingBudget.toFixed(1) + 'm';
        document.getElementById('countText').innerText = activeSquad.length + '/15';
    }

    function setPosFilter(pos) {
        currentPosFilter = pos;
        document.querySelectorAll('.f-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText.includes(pos) || (pos === 'ALL' && btn.innerText.includes('الكل')));
        });
        renderMarket();
    }

    function renderMarket() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const container = document.getElementById('marketList');
        if (!container) return;
        container.innerHTML = '';

        const filtered = rawDatabase.filter(item => {
            const matchesQuery = item.name.toLowerCase().includes(query) || item.club.toLowerCase().includes(query) || item.fullName.toLowerCase().includes(query);
            const matchesPos = currentPosFilter === 'ALL' || item.pos === currentPosFilter;
            return matchesQuery && matchesPos;
        });

        // Display up to 100 live results seamlessly
        filtered.slice(0, 100).forEach(player => {
            const isAdded = activeSquad.some(x => x.id === player.id);
            const div = document.createElement('div');
            div.className = 'market-item';
            div.innerHTML = `
                <img src="${player.img}" onerror="this.src='${fallbackImage}'">
                <div class="market-info">
                    <h4>${player.name}</h4>
                    <p>${player.club} | <b style="color:var(--primary);">${player.pos}</b> | النقاط: ${player.pts}</p>
                </div>
                <div>
                    <span style="font-weight:bold; font-size:13px; margin-left:8px;">£${player.price.toFixed(1)}m</span>
                    <button class="add-btn ${isAdded ? 'remove' : ''}" onclick="togglePlayerSelection(${player.id})">${isAdded ? 'إزالة' : '+'}</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function openModal(id) {
        selectedPlayerId = id;
        const p = activeSquad.find(x => x.id === id);
        if (!p) return;
        document.getElementById('modalPlayerName').innerText = p.name;
        document.getElementById('playerModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('playerModal').style.display = 'none'; }

    function setCaptain(type) {
        if (type === 'C') { captainId = selectedPlayerId; if (viceCaptainId === selectedPlayerId) viceCaptainId = null; }
        else { viceCaptainId = selectedPlayerId; if (captainId === selectedPlayerId) captainId = null; }
        closeModal();
        renderPitch();
    }

    function removeFromSquad() {
        togglePlayerSelection(selectedPlayerId);
        closeModal();
    }
</script>
</body>
</html>
